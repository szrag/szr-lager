<style>
:root {
  --bg: #f2f2f7;
  --bg2: #ffffff;
  --bg3: #e5e5ea;
  --blue: #007aff;
  --blue-l: #e8f3ff;
  --green: #34c759;
  --green-l: #e8f8ed;
  --orange: #ff9500;
  --orange-l: #fff5e6;
  --red: #ff3b30;
  --red-l: #ffe8e7;
  --text: #1c1c1e;
  --text2: #3a3a3c;
  --text3: #6c6c70;
  --text4: #aeaeb2;
  --border: rgba(0,0,0,0.08);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.05);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.08);
  --r: 16px;
  --r-sm: 10px;
  --r-xs: 8px;
  --font: 'DM Sans', -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* ── PAGES ── */
.page { display: none; min-height: 100vh; flex-direction: column; }
.page.active { display: flex; }

/* ── HEADER ── */
.header {
  background: rgba(242,242,247,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 56px 20px 16px;
  position: sticky; top: 0; z-index: 50;
  border-bottom: 1px solid var(--border);
}
.header-inner { display: flex; align-items: center; gap: 12px; }
.back-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--bg2); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); font-size: 18px; color: var(--blue); flex-shrink: 0; }
.header-title { font-size: 20px; font-weight: 700; color: var(--text); flex: 1; }
.header-sub { font-size: 13px; color: var(--text3); margin-top: 2px; }
.header-badge { background: var(--blue); color: white; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 20px; }

/* ── SCROLL CONTENT ── */
.scroll { flex: 1; overflow-y: auto; padding: 16px 16px 100px; }
.scroll::-webkit-scrollbar { display: none; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; padding: 8px 0 20px; z-index: 50;
}
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; border: none; background: transparent; cursor: pointer; }
.nav-item .ni-icon { font-size: 22px; line-height: 1; position: relative; }
.nav-item .ni-label { font-size: 10px; font-weight: 500; color: var(--text4); }
.nav-item.active .ni-label { color: var(--blue); }
.nav-badge { position: absolute; top: -4px; right: -8px; background: var(--red); color: white; font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }

/* ── CARDS ── */
.card { background: var(--bg2); border-radius: var(--r); box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 12px; }
.card-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
.card-title { font-size: 13px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; }

/* ── LANDING PAGE ── */
.landing-hero { padding: 40px 24px 24px; text-align: center; }
.landing-logo { width: 72px; height: 72px; background: var(--blue); border-radius: 20px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,122,255,0.3); }
.landing-logo svg { width: 40px; height: 40px; fill: white; }
.landing-title { font-family: 'DM Serif Display', serif; font-size: 32px; color: var(--text); margin-bottom: 6px; }
.landing-sub { font-size: 15px; color: var(--text3); }
.ship-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 16px; }
.ship-card {
  background: var(--bg2); border-radius: var(--r); padding: 20px 16px;
  box-shadow: var(--shadow); cursor: pointer; border: 2px solid transparent;
  transition: all 0.2s; text-align: center; position: relative; overflow: hidden;
}
.ship-card:active { transform: scale(0.97); }
.ship-card.klein { background: linear-gradient(135deg, #f0fdf4, #dcfce7); border-color: rgba(52,199,89,0.2); }
.ship-card .ship-icon { font-size: 36px; margin-bottom: 8px; }
.ship-card .ship-name { font-size: 15px; font-weight: 700; color: var(--text); }
.ship-card .ship-type { font-size: 12px; color: var(--text3); margin-top: 2px; }
.ship-card .ship-status { position: absolute; top: 10px; right: 10px; width: 10px; height: 10px; border-radius: 50%; }
.ship-card .s-ok { background: var(--green); }
.ship-card .s-warn { background: var(--orange); }
.ship-card .s-bad { background: var(--red); }

/* ── OVERVIEW ITEMS ── */
.overview-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-bottom: 1px solid var(--border);
}
.overview-item:last-child { border-bottom: none; }
.oi-indicator { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.oi-name { flex: 1; font-size: 15px; font-weight: 500; }
.oi-sub { font-size: 12px; color: var(--text3); margin-top: 1px; }
.oi-right { text-align: right; }
.oi-val { font-size: 16px; font-weight: 700; }
.oi-soll { font-size: 12px; color: var(--text3); }
.oi-actions { display: flex; gap: 6px; }
.oi-btn { width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer; font-size: 18px; font-weight: 300; display: flex; align-items: center; justify-content: center; }
.oi-btn-minus { background: var(--red-l); color: var(--red); }
.oi-btn-plus { background: var(--blue-l); color: var(--blue); }

/* ── ALARM ITEM ── */
.alarm-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.alarm-item:last-child { border-bottom: none; }
.alarm-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.alarm-icon.red { background: var(--red-l); }
.alarm-icon.orange { background: var(--orange-l); }
.alarm-info { flex: 1; }
.alarm-name { font-size: 15px; font-weight: 600; }
.alarm-detail { font-size: 13px; color: var(--text3); margin-top: 2px; }
.alarm-btn { padding: 7px 14px; border-radius: 20px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; background: var(--blue); color: white; white-space: nowrap; }

/* ── LOG ── */
.log-item { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.log-item:last-child { border-bottom: none; }
.log-dot-wrap { display: flex; flex-direction: column; align-items: center; padding-top: 4px; }
.log-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.log-line { width: 1px; flex: 1; background: var(--border); margin-top: 4px; }
.log-content { flex: 1; }
.log-title { font-size: 14px; font-weight: 600; }
.log-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
.log-time { font-size: 11px; color: var(--text4); margin-top: 4px; }

/* ── MODAL ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.2s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-sheet { background: var(--bg2); border-radius: 20px 20px 0 0; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; padding: 8px 0 40px; animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1); }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 36px; height: 4px; background: var(--bg3); border-radius: 2px; margin: 8px auto 20px; }
.modal-title { font-size: 20px; font-weight: 700; padding: 0 20px 4px; }
.modal-sub { font-size: 14px; color: var(--text3); padding: 0 20px 20px; }
.modal-section { padding: 0 20px 16px; }
.modal-label { font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.modal-select { width: 100%; padding: 13px 14px; border: 1.5px solid var(--border); border-radius: var(--r-sm); font-size: 15px; font-family: var(--font); background: var(--bg); color: var(--text); appearance: none; }
.modal-select:focus { outline: none; border-color: var(--blue); }

/* ── HERKUNFT GRID ── */
.hk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hk-btn { padding: 14px 12px; border: 2px solid var(--border); border-radius: var(--r-sm); background: var(--bg); cursor: pointer; text-align: center; transition: all 0.15s; }
.hk-btn.sel { border-color: var(--blue); background: var(--blue-l); }
.hk-btn .hk-icon { font-size: 24px; margin-bottom: 6px; }
.hk-btn .hk-label { font-size: 13px; font-weight: 600; color: var(--text2); }

/* ── MENGE PICKER ── */
.menge-picker { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 8px 0; }
.mp-btn { width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer; font-size: 26px; font-weight: 300; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; }
.mp-btn:active { transform: scale(0.9); }
.mp-minus { background: var(--red-l); color: var(--red); }
.mp-plus { background: var(--blue-l); color: var(--blue); }
.mp-val { text-align: center; min-width: 80px; }
.mp-num { font-size: 36px; font-weight: 700; }
.mp-unit { font-size: 13px; color: var(--text3); margin-top: 2px; }

/* ── ACTION BTN ── */
.action-btn { width: calc(100% - 40px); margin: 8px 20px 0; padding: 16px; border-radius: var(--r-sm); border: none; cursor: pointer; font-size: 17px; font-weight: 600; font-family: var(--font); transition: all 0.15s; }
.action-btn:active { transform: scale(0.98); }
.action-btn-blue { background: var(--blue); color: white; box-shadow: 0 4px 12px rgba(0,122,255,0.3); }
.action-btn-red { background: var(--red); color: white; box-shadow: 0 4px 12px rgba(255,59,48,0.3); }
.action-btn-green { background: var(--green); color: white; box-shadow: 0 4px 12px rgba(52,199,89,0.3); }

/* ── SEGMENT CONTROL ── */
.segment { display: flex; background: var(--bg3); border-radius: 10px; padding: 2px; margin: 0 16px 16px; }
.seg-btn { flex: 1; padding: 7px 4px; border: none; background: transparent; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text3); transition: all 0.15s; }
.seg-btn.active { background: white; color: var(--text); font-weight: 600; box-shadow: var(--shadow-sm); }

/* ── EMPTY STATE ── */
.empty { padding: 48px 24px; text-align: center; }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-title { font-size: 17px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
.empty-sub { font-size: 14px; color: var(--text3); }

/* ── SYNC BAR ── */
.sync-bar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 12px; }
.sync-bar.ok { background: var(--green-l); color: var(--green); }
.sync-bar.err { background: var(--red-l); color: var(--red); }
.sync-bar.off { background: var(--bg3); color: var(--text3); }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ── KLEIN BANNER ── */
.klein-banner { background: linear-gradient(135deg, #e8f8ed, #f0fdf4); border: 1px solid rgba(52,199,89,0.2); border-radius: var(--r); padding: 16px; margin-bottom: 16px; }
.kb-title { font-size: 15px; font-weight: 700; color: #1a7a3a; margin-bottom: 4px; }
.kb-sub { font-size: 13px; color: #2d8a4e; }

/* ── FAB ── */
.fab-area { position: fixed; bottom: 90px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 40; }
.fab { width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: var(--shadow-lg); transition: transform 0.15s; }
.fab:active { transform: scale(0.93); }
.fab-blue { background: var(--blue); color: white; }
.fab-red { background: var(--red); color: white; }
.fab-green { background: var(--green); color: white; }

/* ── TAGS ── */
.tag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.tag-ok { background: var(--green-l); color: var(--green); }
.tag-warn { background: var(--orange-l); color: var(--orange); }
.tag-bad { background: var(--red-l); color: var(--red); }
.tag-none { background: var(--bg3); color: var(--text3); }
</style>
</head>

async function sbGet(table,filter=''){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/${table}?${filter}&limit=1000`,{headers:{...SB_HEADERS,'Accept':'application/json'}});
    return r.ok?await r.json():null;
  }catch(e){return null;}
}
async function sbUpsert(table,data){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:{...SB_HEADERS,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(data)});
    return r.ok||r.status===201;
  }catch(e){return false;}
}
async function sbInsert(table,data){
  try{
    const r=await fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:SB_HEADERS,body:JSON.stringify(data)});

function fmtH(v,typ){const u=typ==='wein'?'Einh.':'Hr.';if(v===0)return'0 '+u;if(v%1===0)return v+' '+u;return'½ '+u;}
function fmtT(iso){if(!iso)return'–';try{const d=new Date(iso);return d.toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function now(){return new Date().toISOString();}

function getStatus(bestand,soll){
  if(bestand<=0)return'bad';
  if(soll>0&&bestand<soll)return'warn';
  return'ok';
}
function statusColor(s){return s==='bad'?'var(--red)':s==='warn'?'var(--orange)':'var(--green)';}
function statusTag(s){return s==='bad'?'<span class="tag tag-bad">Leer</span>':s==='warn'?'<span class="tag tag-warn">Tief</span>':'<span class="tag tag-ok">OK</span>';}

function isKlein(id){return SCHIFFE_K.some(s=>s.id===id);}

function schiffStatus(id){
  if(isKlein(id))return'ok';
  if(!state[id])return'ok';
  let worst='ok';
  ['soft','wein'].forEach(typ=>{
    state[id][typ].forEach(r=>{
      const s=getStatus(r.bestand,r.soll);
      if(s==='bad')worst='bad';
      else if(s==='warn'&&worst!=='bad')worst='warn';
    });
  });
  return worst;
}

function countAlarms(id){
  if(isKlein(id)||!state[id])return 0;
  let n=0;
  ['soft','wein'].forEach(typ=>{state[id][typ].forEach(r=>{if(getStatus(r.bestand,r.soll)!=='ok')n++;});});
  return n;
}

function renderSchiff(){
  const id=currentSchiff;
  const klein=isKlein(id);
  const alarms=countAlarms(id);
  const badge=document.getElementById('alarm-badge');
  if(alarms>0){badge.style.display='';badge.textContent=alarms;}
  else badge.style.display='none';

  const fabs=document.getElementById('schiff-fabs');
  if(klein){
    fabs.innerHTML=`<button class="fab fab-green" onclick="openBezug()" title="Bezug aus Bootshaus">⇄</button>`;
  } else {
    fabs.innerHTML=`
      <button class="fab fab-red" onclick="openAbgang()" title="Verbrauch">−</button>
      <button class="fab fab-blue" onclick="openZubuchung()" title="Auffüllen">+</button>`;
  }

  const content=document.getElementById('schiff-content');
  if(klein){content.innerHTML=renderKlein(id);return;}

  if(schiffTab==='übersicht') content.innerHTML=renderÜbersicht(id);
  else if(schiffTab==='alarm') content.innerHTML=renderAlarm(id);
  else content.innerHTML=renderAktivität(id);
}

    <button class="seg-btn ${produktTab==='wein'?'active':''}" onclick="produktTab='wein';renderSchiff()">Wein (6er)</button>
  </div>`;

  const items=produktTab==='soft'?SOFT:WEIN;
  let lastKat='';
  let rows='';
  items.forEach((p,i)=>{
    const r=d[produktTab][i];
    const st=getStatus(r.bestand,r.soll);
    const diff=r.soll>0?r.bestand-r.soll:null;
    const diffHtml=diff!==null?`<span style="font-size:11px;font-weight:600;color:${diff>=0?'var(--green)':'var(--red)'};margin-left:4px">${diff>=0?'+':''}${diff}</span>`:'';

        <div class="oi-name">${p.name}</div>
        <div class="oi-sub">${produktTab==='soft'?p.geb:'6er-Einheit · '+p.vol}</div>
      </div>
      <div class="oi-right" style="margin-right:10px">

      </div>
      <div class="oi-actions">
        <button class="oi-btn oi-btn-minus" onclick="quickA('${produktTab}',${i})">−</button>

function renderAlarm(id){
  const d=state[id];
  const alarms=[];
  ['soft','wein'].forEach(typ=>{
    (typ==='soft'?SOFT:WEIN).forEach((p,i)=>{
      const r=d[typ][i];
      const st=getStatus(r.bestand,r.soll);
      if(st!=='ok')alarms.push({...p,typ,idx:i,r,st});
    });
  });

  if(!alarms.length)return`<div class="empty"><div class="empty-icon">✅</div><div class="empty-title">Alles OK!</div><div class="empty-sub">Keine Alarme aktiv.</div></div>`;

  const bad=alarms.filter(a=>a.st==='bad');
  const warn=alarms.filter(a=>a.st==='warn');

  let html='';
  if(bad.length){
    html+=`<div style="padding:8px 16px 6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--red)">🔴 Leer (${bad.length})</div>`;
    html+=`<div class="card">${bad.map(a=>`
      <div class="alarm-item">
        <div class="alarm-icon red">📦</div>
        <div class="alarm-info">
          <div class="alarm-name">${a.name}</div>
          <div class="alarm-detail">${a.typ==='soft'?a.geb:'6er-Einheit'} · Ist: ${fmtH(a.r.bestand,a.typ)} · Soll: ${fmtH(a.r.soll,a.typ)}</div>
        </div>
        <button class="alarm-btn" onclick="toggleOrder('${a.typ}',${a.idx})">${a.r.bestellt?'✓ Gemeldet':'Bestellen'}</button>
      </div>`).join('')}</div>`;
  }
  if(warn.length){
    html+=`<div style="padding:8px 16px 6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--orange)">🟠 Tief (${warn.length})</div>`;
    html+=`<div class="card">${warn.map(a=>`
      <div class="alarm-item">
        <div class="alarm-icon orange">⚠️</div>
        <div class="alarm-info">
          <div class="alarm-name">${a.name}</div>
          <div class="alarm-detail">${a.typ==='soft'?a.geb:'6er-Einheit'} · Ist: ${fmtH(a.r.bestand,a.typ)} · Soll: ${fmtH(a.r.soll,a.typ)}</div>
        </div>
        <button class="alarm-btn" onclick="toggleOrder('${a.typ}',${a.idx})">${a.r.bestellt?'✓ Gemeldet':'Bestellen'}</button>
      </div>`).join('')}</div>`;
  }

  // Drucken
  html+=`<button onclick="printAlarm('${id}')" style="width:100%;padding:14px;border-radius:var(--r-sm);border:1.5px solid var(--border);background:white;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px">🖨 Bestellliste drucken</button>`;
  return html;
}

function adjust(id,typ,idx,delta){
  if(!state[id])return;
  state[id][typ][idx].bestand=Math.max(0,Math.round((state[id][typ][idx].bestand+delta)*2)/2);
  state[id][typ][idx].updated=now();
}

  const {typ,art,menge,herkunft,vonSchiff}=zF;
  const id=currentSchiff;
  const name=(typ==='soft'?SOFT:WEIN)[art].name;
  const einheit=typ==='wein'?'Einh.':'Hr.';
  adjust(id,typ,art,+menge);
  const von=herkunft==='lieferung'?'Lieferung':herkunft==='bootshaus'?'Bootshaus':vonSchiff;
  if(herkunft==='bootshaus')adjust('Bootshaus',typ,art,-menge);
  else if(herkunft==='schiff'&&state[vonSchiff])adjust(vonSchiff,typ,art,-menge);
  const e={typ:'Zubuchung',von,nach:id,artikel:name,menge,einheit,zeit:now()};
  addLog(e);
  await pushRow(id,typ,art);
  if(herkunft==='bootshaus')await pushRow('Bootshaus',typ,art);
  else if(herkunft==='schiff'&&state[vonSchiff])await pushRow(vonSchiff,typ,art);
  await pushLog(e);
}
async function doA(){
  const {typ,art,menge}=aF;
  const id=currentSchiff;
  const name=(typ==='soft'?SOFT:WEIN)[art].name;
  const einheit=typ==='wein'?'Einh.':'Hr.';
  adjust(id,typ,art,-menge);
  const e={typ:'Verbrauch',von:id,nach:'',artikel:name,menge,einheit,zeit:now()};
  addLog(e);
  await pushRow(id,typ,art);
  await pushLog(e);
}
async function doB(){
  const {schiff,typ,art,menge}=bF;
  const name=(typ==='soft'?SOFT:WEIN)[art].name;
  const einheit=typ==='wein'?'Einh.':'Hr.';
  adjust('Bootshaus',typ,art,-menge);
  const e={typ:'Bezug',von:'Bootshaus',nach:schiff,artikel:name,menge,einheit,zeit:now()};
  addLog(e);
  await pushRow('Bootshaus',typ,art);
  await pushLog(e);
}

async function toggleOrder(typ,idx){
  const id=currentSchiff;
  state[id][typ][idx].bestellt=state[id][typ][idx].bestellt?0:1;
  save();
  await pushRow(id,typ,idx);
  renderSchiff();
}

function openZubuchung(){modal='zubuchung';renderModal();}
function openAbgang(){modal='abgang';renderModal();}
function openBezug(){modal='bezug';renderModal();}
function closeModal(){modal=null;renderModal();}
function quickZ(typ,idx){zF.typ=typ;zF.art=idx;openZubuchung();}
function quickA(typ,idx){aF.typ=typ;aF.art=idx;openAbgang();}
async function commitZ(){await doZ();closeModal();renderSchiff();renderLanding();}
async function commitA(){await doA();closeModal();renderSchiff();renderLanding();}
async function commitB(){await doB();closeModal();renderSchiff();}

function printAlarm(id){
  const alarms=[];
  ['soft','wein'].forEach(typ=>{
    (typ==='soft'?SOFT:WEIN).forEach((p,i)=>{
      const r=state[id][typ][i];
      if(getStatus(r.bestand,r.soll)!=='ok')alarms.push({...p,typ,r});
    });
  });
  const w=window.open('','_blank');
  w.document.write(`<html><head><title>Bestellliste ${id} · ${new Date().toLocaleDateString('de-CH')}</title>
  <style>body{font-family:sans-serif;font-size:13px;padding:20px}h2{margin-bottom:4px}p{color:#666;margin-bottom:16px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px 10px;text-align:left}th{background:#f5f5f5;font-weight:600}tr:nth-child(even){background:#fafafa}.bad{color:#ff3b30;font-weight:600}.warn{color:#ff9500;font-weight:600}</style></head>
  <body><h2>Bestellliste · ${id}</h2><p>${new Date().toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
  <table><thead><tr><th>Artikel</th><th>Gebinde</th><th>Ist</th><th>Soll</th><th>Status</th></tr></thead><tbody>
  ${alarms.map(a=>`<tr><td>${a.name}</td><td>${a.typ==='soft'?a.geb:'6er-Einh.'}</td>
    <td>${fmtH(a.r.bestand,a.typ)}</td><td>${fmtH(a.r.soll,a.typ)}</td>
    <td class="${a.r.bestand<=0?'bad':'warn'}">${a.r.bestand<=0?'LEER':'TIEF'}</td></tr>`).join('')}
  </tbody></table></body></html>`);
  w.print();
}
