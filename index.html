<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SZR · Schiff</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SZR Schiff">
<meta name="theme-color" content="#f2f2f7">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f2f7;--bg2:#fff;--bg3:#e5e5ea;
  --blue:#007aff;--blue-l:#e8f3ff;
  --green:#34c759;--green-l:#e8f8ed;
  --orange:#ff9500;--orange-l:#fff5e6;
  --red:#ff3b30;--red-l:#ffe8e7;
  --purple:#af52de;--purple-l:#f3e8ff;
  --brown:#8b4513;--brown-l:#fdf0e6;
  --text:#1c1c1e;--text2:#3a3a3c;--text3:#6c6c70;--text4:#aeaeb2;
  --border:rgba(0,0,0,0.08);
  --sh:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --sh-lg:0 8px 24px rgba(0,0,0,0.10);
  --r:16px;--rs:10px;--rxs:8px;
  --font:'DM Sans',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.page{display:none;flex-direction:column;min-height:100vh}
.page.active{display:flex}
.hdr{background:rgba(242,242,247,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:52px 16px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.hdr-row{display:flex;align-items:center;gap:10px}
.back{width:32px;height:32px;border-radius:50%;background:var(--bg2);border:none;cursor:pointer;font-size:20px;color:var(--blue);display:flex;align-items:center;justify-content:center;box-shadow:var(--sh);flex-shrink:0}
.hdr-title{font-size:19px;font-weight:700;flex:1}
.sync-pill{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.sp-ok{background:var(--green-l);color:var(--green)}
.sp-err{background:var(--red-l);color:var(--red)}
.sp-off{background:var(--bg3);color:var(--text3)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.alarm-badge{background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px}
.scroll{flex:1;overflow-y:auto;padding:12px 16px 100px}
.scroll::-webkit-scrollbar{display:none}
.seg{display:flex;background:var(--bg3);border-radius:10px;padding:2px;margin:10px 16px 0}
.seg-btn{flex:1;padding:6px 2px;border:none;background:transparent;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text3);font-family:var(--font);white-space:nowrap}
.seg-btn.active{background:#fff;color:var(--text);font-weight:700;box-shadow:var(--sh)}
.cat-tabs{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--text3);flex-shrink:0}
.cat-tab.active{color:#fff;border-color:transparent}
.ct-soft.active{background:var(--blue)}
.ct-wein.active{background:var(--purple)}
.ct-bier.active{background:var(--brown)}
.ct-spirits.active{background:var(--orange)}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.hero{padding:40px 20px 20px;text-align:center}
.hero-logo{width:72px;height:72px;background:var(--blue);border-radius:20px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,122,255,0.3)}
.hero-title{font-size:28px;font-weight:700;margin-bottom:4px}
.hero-sub{font-size:15px;color:var(--text3)}
.ship-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.ship-card{background:#fff;border-radius:var(--r);padding:18px 14px;box-shadow:var(--sh);cursor:pointer;text-align:center;position:relative;border:2px solid transparent;transition:all 0.15s}
.ship-card:active{transform:scale(0.97)}
.ship-card.klein{background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-color:rgba(52,199,89,0.2)}
.ship-icon{font-size:34px;margin-bottom:6px}
.ship-name{font-size:14px;font-weight:700}
.ship-type{font-size:11px;color:var(--text3);margin-top:2px}
.ship-status{position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%}
.s-ok{background:var(--green)}.s-warn{background:var(--orange)}.s-bad{background:var(--red)}
.ov-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border)}
.ov-row:last-child{border-bottom:none}
.ov-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ov-info{flex:1;min-width:0}
.ov-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-sub{font-size:11px;color:var(--text3);margin-top:1px}
.ov-val{text-align:right;margin-right:8px}
.ov-ist{font-size:16px;font-weight:700}
.ov-soll{font-size:11px;color:var(--text3)}
.ov-btns{display:flex;gap:5px;flex-shrink:0}
.ov-btn{width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;font-size:18px;font-weight:300;display:flex;align-items:center;justify-content:center}
.ob-m{background:var(--red-l);color:var(--red)}
.ob-p{background:var(--blue-l);color:var(--blue)}
.al-item{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--border)}
.al-item:last-child{border-bottom:none}
.al-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.al-info{flex:1}
.al-name{font-size:14px;font-weight:600}
.al-detail{font-size:12px;color:var(--text3);margin-top:2px}
.al-actions{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.al-btn{padding:6px 12px;border-radius:20px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:var(--font);white-space:nowrap}
.al-btn-blue{background:var(--blue);color:#fff}
.al-btn-green{background:var(--green-l);color:var(--green)}
.al-btn-gray{background:var(--bg3);color:var(--text3)}
.log-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border)}
.log-item:last-child{border-bottom:none}
.log-dot-col{display:flex;flex-direction:column;align-items:center;padding-top:3px}
.log-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.log-line{width:1px;flex:1;background:var(--border);margin-top:3px}
.log-body{flex:1}
.log-title{font-size:13px;font-weight:600}
.log-sub{font-size:11px;color:var(--text3);margin-top:2px}
.log-time{font-size:10px;color:var(--text4);margin-top:3px}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.t-ok{background:var(--green-l);color:var(--green)}
.t-warn{background:var(--orange-l);color:var(--orange)}
.t-bad{background:var(--red-l);color:var(--red)}
.t-blue{background:var(--blue-l);color:var(--blue)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:8px 0 40px}
.handle{width:36px;height:4px;background:var(--bg3);border-radius:2px;margin:8px auto 18px}
.sh-title{font-size:18px;font-weight:700;padding:0 20px 3px}
.sh-sub{font-size:13px;color:var(--text3);padding:0 20px 16px}
.sh-sec{padding:0 20px 14px}
.sh-label{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.sh-select{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:15px;font-family:var(--font);background:var(--bg);color:var(--text);appearance:none}
.sh-select:focus{outline:none;border-color:var(--blue)}
.hk-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hk-btn{padding:12px 8px;border:2px solid var(--border);border-radius:var(--rs);background:var(--bg);cursor:pointer;text-align:center}
.hk-btn.sel{border-color:var(--blue);background:var(--blue-l)}
.hk-icon{font-size:22px;margin-bottom:4px}
.hk-label{font-size:12px;font-weight:600;color:var(--text2)}
.mp{display:flex;align-items:center;justify-content:center;gap:16px;padding:8px 0}
.mp-btn{width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;font-size:26px;font-weight:300;display:flex;align-items:center;justify-content:center}
.mp-btn:active{transform:scale(0.9)}
.mp-m{background:var(--red-l);color:var(--red)}
.mp-p{background:var(--blue-l);color:var(--blue)}
.mp-val{text-align:center;min-width:80px}
.mp-num{font-size:34px;font-weight:700}
.mp-unit{font-size:12px;color:var(--text3);margin-top:2px}
.act-btn{width:calc(100% - 40px);margin:8px 20px 0;padding:15px;border-radius:var(--rs);border:none;cursor:pointer;font-size:16px;font-weight:700;font-family:var(--font)}
.act-btn:active{transform:scale(0.98)}
.ab-blue{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(0,122,255,0.3)}
.ab-red{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(255,59,48,0.3)}
.ab-green{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(52,199,89,0.3)}
.fabs{position:fixed;bottom:24px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:40}
.fab{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:var(--sh-lg)}
.fab:active{transform:scale(0.92)}
.fab-blue{background:var(--blue);color:#fff}
.fab-red{background:var(--red);color:#fff}
.fab-green{background:var(--green);color:#fff}
.k-banner{background:var(--green-l);border:1px solid rgba(52,199,89,0.2);border-radius:var(--r);padding:14px;margin-bottom:14px;font-size:13px;color:#1a7a3a}
.k-banner strong{display:block;font-size:15px;margin-bottom:3px}
.empty{padding:40px 20px;text-align:center}
.empty-icon{font-size:44px;margin-bottom:10px}
.empty-title{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:5px}
.empty-sub{font-size:13px;color:var(--text3)}
.stitle{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 7px}
.cat-hdr{padding:6px 14px;background:var(--bg);font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.menge-row{display:flex;align-items:center;gap:8px;margin-top:4px}
.menge-inp{width:60px;padding:5px 8px;border:1.5px solid var(--border);border-radius:var(--rxs);font-size:14px;text-align:center;font-family:var(--font);background:var(--bg)}

</div>

  <div id="cat-tabs-wrap"></div>
  <div class="scroll" id="ship-content"></div>
  <div class="fabs" id="ship-fabs"></div>
</div>

let isSyncing=false;
async function doSync(){
  if(isSyncing)return;
  isSyncing=true;
  setSyncUI('syncing');
  const items=await sbGet('lagerbestand2');
  if(items){
    items.forEach(it=>{
      const{standort,kat,artikel_index:idx,bestand,soll,bestellt,bestell_menge}=it;
      if(state[standort]&&state[standort][kat]&&state[standort][kat][idx]!==undefined){
        state[standort][kat][idx].bestand=parseFloat(bestand)||0;
        state[standort][kat][idx].soll=parseFloat(soll)||0;
        state[standort][kat][idx].bestellt=bestellt===true||bestellt===1?1:0;
        state[standort][kat][idx].bestellMenge=parseFloat(bestell_menge)||0;
      }
    });
  }
  const li=await sbGet('transaktionen2','order=zeitpunkt.desc');
  if(li)log=li.map(t=>({zeit:t.zeitpunkt,typ:t.typ,von:t.von,nach:t.nach,artikel:t.artikel,menge:t.menge,einheit:t.einheit,kat:t.kat})).slice(0,200);
  save();
  setSyncUI(items?'ok':'offline');
  isSyncing=false;
  renderLanding();
  if(curSchiff)renderSchiff();
}

function setSyncUI(status){
  const cfg={syncing:{cls:'sp-ok',txt:'Synchronisiere…'},ok:{cls:'sp-ok',txt:'Verbunden'},offline:{cls:'sp-err',txt:'Offline'}};
  const c=cfg[status]||cfg.offline;
  ['sync-land','sync-ship'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.className='sync-pill '+c.cls;const t=el.querySelector('span');if(t)t.textContent=c.txt;}
  });
}

// ════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════
function now(){return new Date().toISOString();}
function fmtH(v,kat){
  const u=KATEGORIEN.find(k=>k.id===kat)?.einheit||'';
  if(v===0)return'0 '+u;
  if(v%1===0)return v+' '+u;
  return'½ '+u;
}
function fmtT(iso){
  if(!iso)return'–';
  try{const d=new Date(iso);return d.toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});}
  catch(e){return'';}
}
function getStatus(b,s){if(b<=0)return'bad';if(s>0&&b<s)return'warn';return'ok';}
function statusCol(s){return s==='bad'?'var(--red)':s==='warn'?'var(--orange)':'var(--green)';}
function isKlein(id){return SCHIFFE_K.some(s=>s.id===id);}
function schiffStatus(id){
  if(isKlein(id)||!state[id])return'ok';
  let w='ok';
  KATEGORIEN.forEach(k=>{state[id][k.id].forEach(r=>{const s=getStatus(r.bestand,r.soll);if(s==='bad')w='bad';else if(s==='warn'&&w!=='bad')w='warn';});});
  return w;
}
function countAlarms(id){
  if(isKlein(id)||!state[id])return 0;
  let n=0;
  KATEGORIEN.forEach(k=>{state[id][k.id].forEach(r=>{if(getStatus(r.bestand,r.soll)!=='ok')n++;});});
  return n;
}

function renderLanding(){
  const g=document.getElementById('ship-grid');
  g.innerHTML=ALLE.map(s=>{
    const st=schiffStatus(s.id);
    const al=countAlarms(s.id);
    // Count pending orders
    let pending=0;
    if(state[s.id])KATEGORIEN.forEach(k=>{state[s.id][k.id].forEach(r=>{if(r.bestellt)pending++;});});
    return`<div class="ship-card ${isKlein(s.id)?'klein':''}" onclick="selectSchiff('${s.id}')">
      <div class="ship-status ${st==='bad'?'s-bad':st==='warn'?'s-warn':'s-ok'}"></div>
      <div class="ship-icon">${s.icon}</div>
      <div class="ship-name">${s.name}</div>
      <div class="ship-type">${s.type}</div>
      ${al>0?`<div style="margin-top:6px"><span class="tag ${st==='bad'?'t-bad':'t-warn'}">${al} Alarm${al>1?'e':''}</span></div>`:''}
      ${pending>0?`<div style="margin-top:4px"><span class="tag t-blue">${pending} bestellt</span></div>`:''}
    </div>`;
  }).join('');
}

  }

  const ctWrap=document.getElementById('cat-tabs-wrap');
  if(!klein&&curTab==='übersicht'){
    ctWrap.innerHTML=`<div class="cat-tabs">${KATEGORIEN.map(k=>`
      <button class="cat-tab ${k.tab} ${curKat===k.id?'active':''}" onclick="setCat('${k.id}')">${k.label}</button>`).join('')}</div>`;
  } else {ctWrap.innerHTML='';}

  if(curTab==='übersicht')content.innerHTML=renderÜbersicht(id);

function renderÜbersicht(id){
  const d=state[id][curKat];
  const prods=PRODUKTE[curKat];
  const kat=KATEGORIEN.find(k=>k.id===curKat);
  let lastCat='',html='<div class="card">';
  prods.forEach((p,i)=>{
    const r=d[i];
    const st=getStatus(r.bestand,r.soll);
    const diff=r.soll>0?Math.round((r.bestand-r.soll)*2)/2:null;
    const diffHtml=diff!==null?`<span style="font-size:10px;font-weight:700;margin-left:3px;color:${diff>=0?'var(--green)':'var(--red)'}">${diff>=0?'+':''}${diff}</span>`:'';
    if(p.kat&&p.kat!==lastCat){html+=`<div class="cat-hdr">${p.kat}</div>`;lastCat=p.kat;}
    html+=`<div class="ov-row">
      <div class="ov-dot" style="background:${statusCol(st)}"></div>
      <div class="ov-info">
        <div class="ov-name">${p.name}</div>
        <div class="ov-sub">${p.geb||kat.einheit}${r.bestellt?` · <span style="color:var(--green);font-weight:600">✓ Gemeldet (${fmtH(r.bestellMenge||1,curKat)})</span>`:''}</div>
      </div>
      <div class="ov-val">
        <div class="ov-ist">${fmtH(r.bestand,curKat)}${diffHtml}</div>
        <div class="ov-soll">Soll: ${fmtH(r.soll,curKat)}</div>
      </div>
      <div class="ov-btns">
        <button class="ov-btn ob-m" onclick="quickA('${curKat}',${i})">−</button>
        <button class="ov-btn ob-p" onclick="quickZ('${curKat}',${i})">+</button>
      </div>
    </div>`;
  });
  return html+'</div>';
}

function renderAlarm(id){
  const alarms=[];
  KATEGORIEN.forEach(k=>{
    PRODUKTE[k.id].forEach((p,i)=>{
      const r=state[id][k.id][i];
      const st=getStatus(r.bestand,r.soll);
      if(st!=='ok')alarms.push({...p,kat:k.id,katLabel:k.label,idx:i,r,st});
    });
  });
  if(!alarms.length)return`<div class="empty"><div class="empty-icon">✅</div><div class="empty-title">Alles OK!</div><div class="empty-sub">Keine Alarme.</div></div>`;

  const bad=alarms.filter(a=>a.st==='bad');
  const warn=alarms.filter(a=>a.st==='warn');
  let html='';

  [['🔴 Leer',bad,'var(--red-l)'],['🟠 Tief',warn,'var(--orange-l)']].forEach(([title,list,bg])=>{
    if(!list.length)return;
    html+=`<div class="stitle">${title} (${list.length})</div><div class="card">`;
    list.forEach(a=>{
      const gemeldet=a.r.bestellt===1;
      html+=`<div class="al-item">
        <div class="al-icon" style="background:${bg}">${a.st==='bad'?'🔴':'🟠'}</div>
        <div class="al-info">
          <div class="al-name">${a.name}</div>
          <div class="al-detail">${a.katLabel} · Ist: ${fmtH(a.r.bestand,a.kat)} · Soll: ${fmtH(a.r.soll,a.kat)}</div>
          ${gemeldet?`<div style="font-size:11px;color:var(--green);font-weight:600;margin-top:3px">✓ Gemeldet — ${fmtH(a.r.bestellMenge||1,a.kat)} bestellt</div>`:''}
        </div>
        <div class="al-actions">
          ${gemeldet
            ?`<button class="al-btn al-btn-gray" onclick="editBestellMenge('${a.kat}',${a.idx})">Menge ändern</button>
               <button class="al-btn al-btn-gray" onclick="toggleOrder('${a.kat}',${a.idx})">Zurückziehen</button>`
            :`<button class="al-btn al-btn-blue" onclick="openBestellen('${a.kat}',${a.idx})">Bestellen</button>`
          }
        </div>
      </div>`;
    });
    html+='</div>';
  });
  html+=`<button onclick="printAlarm('${id}')" style="width:100%;padding:13px;border-radius:var(--rs);border:1.5px solid var(--border);background:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px">🖨 Bestellliste drucken</button>`;
  return html;
}

function renderLog(id){
  const items=log.filter(e=>e.von===id||e.nach===id).slice(0,40);
  if(!items.length)return`<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Noch nichts</div><div class="empty-sub">Hier erscheinen alle Aktionen.</div></div>`;
  return`<div class="card">${items.map((e,i)=>{
    const col=e.typ==='Zubuchung'?'var(--blue)':e.typ==='Verbrauch'?'var(--red)':'var(--green)';
    return`<div class="log-item">
      <div class="log-dot-col"><div class="log-dot" style="background:${col}"></div>${i<items.length-1?'<div class="log-line"></div>':''}</div>
      <div class="log-body">
        <div class="log-title">${e.typ==='Zubuchung'?'↑':'↓'} ${e.typ} · ${e.menge} ${e.einheit||''}</div>
        <div class="log-sub">${e.artikel}</div>
        <div class="log-sub">${e.von||'–'} → ${e.nach||'–'}</div>
        <div class="log-time">${fmtT(e.zeit)}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

async function doZ(){
  const {kat,art,menge,herkunft,vonSchiff}=zF;
  const id=curSchiff;
  const name=PRODUKTE[kat][art].name;
  const einheit=KATEGORIEN.find(k=>k.id===kat)?.einheit||'';
  const von=herkunft==='lieferung'?'Lieferung':herkunft==='bootshaus'?'Bootshaus':vonSchiff;
  state[id][kat][art].bestand=Math.max(0,Math.round((state[id][kat][art].bestand+menge)*2)/2);
  if(herkunft==='bootshaus'&&state['Bootshaus'])
    state['Bootshaus'][kat][art].bestand=Math.max(0,Math.round((state['Bootshaus'][kat][art].bestand-menge)*2)/2);
  else if(herkunft==='schiff'&&state[vonSchiff])
    state[vonSchiff][kat][art].bestand=Math.max(0,Math.round((state[vonSchiff][kat][art].bestand-menge)*2)/2);
  save();
  const e={zeit:now(),typ:'Zubuchung',von,nach:id,artikel:name,menge,einheit,kat};
  log.unshift(e);save();
  await pushDelta(id,kat,art,+menge);
  if(herkunft==='bootshaus')await pushDelta('Bootshaus',kat,art,-menge);
  else if(herkunft==='schiff'&&state[vonSchiff])await pushDelta(vonSchiff,kat,art,-menge);
  await pushLog(e);
  await doSync();
}

async function doA(){
  const {kat,art,menge}=aF;
  const id=curSchiff;
  const name=PRODUKTE[kat][art].name;
  const einheit=KATEGORIEN.find(k=>k.id===kat)?.einheit||'';
  state[id][kat][art].bestand=Math.max(0,Math.round((state[id][kat][art].bestand-menge)*2)/2);
  save();
  const e={zeit:now(),typ:'Verbrauch',von:id,nach:'',artikel:name,menge,einheit,kat};
  log.unshift(e);save();
  await pushDelta(id,kat,art,-menge);
  await pushLog(e);
  await doSync();
}

async function doB(){
  const {schiff,kat,art,menge}=bF;
  const name=PRODUKTE[kat][art].name;
  const einheit=KATEGORIEN.find(k=>k.id===kat)?.einheit||'';

  const e={zeit:now(),typ:'Bezug',von:'Bootshaus',nach:schiff,artikel:name,menge,einheit,kat};

async function toggleOrder(kat,idx){
  const id=curSchiff;
  const newVal=state[id][kat][idx].bestellt?0:1;
  state[id][kat][idx].bestellt=newVal;
  if(!newVal)state[id][kat][idx].bestellMenge=0;
  save();renderSchiff();
  await pushMeta(id,kat,idx,newVal===1,newVal?state[id][kat][idx].bestellMenge:0);
  await doSync();
}

async function commitBestellen(){
  const {kat,art,menge}=bestellF;
  const id=curSchiff;
  state[id][kat][art].bestellt=1;
  state[id][kat][art].bestellMenge=menge;
  save();closeModal();renderSchiff();
  await pushMeta(id,kat,art,true,menge);
  await doSync();
}

  await pushMeta(id,kat,art,true,menge);

function openZubuchung(){modal='zubuchung';renderModal();}
function openAbgang(){modal='abgang';renderModal();}
function openBezug(){modal='bezug';renderModal();}
function closeModal(){modal=null;renderModal();}
function quickZ(kat,idx){zF.kat=kat;zF.art=idx;openZubuchung();}
function quickA(kat,idx){aF.kat=kat;aF.art=idx;openAbgang();}
function openBestellen(kat,idx){
  bestellF.kat=kat;bestellF.art=idx;
  const r=state[curSchiff][kat][idx];
  bestellF.menge=r.soll>r.bestand?Math.round((r.soll-r.bestand)*2)/2:1;
  modal='bestellen';renderModal();
}
function editBestellMenge(kat,idx){
  bestellF.kat=kat;bestellF.art=idx;
  bestellF.menge=state[curSchiff][kat][idx].bestellMenge||1;
  modal='editMenge';renderModal();
}

async function commitZ(){closeModal();await doZ();renderSchiff();renderLanding();}
async function commitA(){closeModal();await doA();renderSchiff();renderLanding();}
async function commitB(){closeModal();await doB();renderSchiff();}

function printAlarm(id){
  const alarms=[];
  KATEGORIEN.forEach(k=>{PRODUKTE[k.id].forEach((p,i)=>{const r=state[id][k.id][i];if(getStatus(r.bestand,r.soll)!=='ok')alarms.push({...p,kat:k.id,katLabel:k.label,r,bestellt:r.bestellt,bestellMenge:r.bestellMenge});});});
  const w=window.open('','_blank');
  w.document.write(`<html><head><title>Bestellliste ${id}</title>
  <style>body{font-family:sans-serif;font-size:13px;padding:20px}h2{margin-bottom:4px}p{color:#666;margin-bottom:16px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:7px 10px}th{background:#f5f5f5}.bestellt{color:green;font-weight:600}</style></head>
  <body><h2>Bestellliste · ${id}</h2><p>${new Date().toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
  <table><thead><tr><th>Kategorie</th><th>Artikel</th><th>Ist</th><th>Soll</th><th>Bestell-Menge</th><th>Status</th></tr></thead>
  <tbody>${alarms.map(a=>`<tr><td>${a.katLabel}</td><td>${a.name}</td><td>${fmtH(a.r.bestand,a.kat)}</td><td>${fmtH(a.r.soll,a.kat)}</td>
    <td class="${a.bestellt?'bestellt':''}">${a.bestellt?fmtH(a.bestellMenge,a.kat):'–'}</td>
    <td style="color:${a.r.bestand<=0?'red':'orange'};font-weight:600">${a.r.bestand<=0?'LEER':'TIEF'}</td></tr>`).join('')}
  </tbody></table></body></html>`);
  w.print();
}
