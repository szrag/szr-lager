<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SZR Lagerverwaltung</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SZR Lager">
<meta name="theme-color" content="#1a4f8a">
<style>
:root{--blue:#1a4f8a;--blue-l:#e8f0fa;--blue-m:#3a72c4;--teal:#0d7a5f;--teal-l:#e3f5f0;--amber:#b85c00;--amber-l:#fff3e0;--red:#c0392b;--red-l:#fdecea;--gray-l:#f4f5f7;--border:#dde2ec;--text:#1a1f2e;--muted:#6b7280;--r:10px;--rs:6px;--sh:0 1px 4px rgba(0,0,0,0.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef1f7;color:var(--text);font-size:15px;min-height:100vh}
/* TOPBAR */
.topbar{background:var(--blue);color:#fff;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar h1{font-size:17px;font-weight:700;flex:1}.topbar h1 span{opacity:.6;font-weight:400;font-size:13px;margin-left:6px}
.mode-toggle{display:flex;background:rgba(255,255,255,.15);border-radius:8px;padding:3px;gap:2px}
.mode-btn{padding:5px 13px;border-radius:6px;border:none;background:transparent;color:rgba(255,255,255,.75);font-size:13px;font-weight:500;cursor:pointer}
.mode-btn.active{background:#fff;color:var(--blue)}
/* SUBNAV */
.subnav{background:#fff;border-bottom:1px solid var(--border);padding:0 12px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.snb{padding:11px 12px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.snb.active{color:var(--blue);border-bottom-color:var(--blue)}
.snb.klein{color:var(--teal)}.snb.klein.active{border-bottom-color:var(--teal)}
/* SYNC */
.sync{font-size:12px;padding:5px 16px;display:flex;align-items:center;gap:6px;border-bottom:1px solid}
.sync.ok{background:var(--teal-l);color:var(--teal);border-color:#b0ddd0}
.sync.err{background:var(--red-l);color:var(--red);border-color:#f5a9a0}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}
/* TABS */
.tabs{display:flex;gap:6px;padding:12px 16px 0}
.tab{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:13px;color:var(--muted);cursor:pointer;font-weight:500}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
/* CONTENT */
.content{padding:12px 16px 100px}
/* CARD */
.card{background:#fff;border-radius:var(--r);border:1px solid var(--border);margin-bottom:10px;overflow:hidden;box-shadow:var(--sh)}
/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border-radius:var(--r);padding:11px 12px;border:1px solid var(--border);box-shadow:var(--sh)}
.stat-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.stat-v{font-size:24px;font-weight:700}
.c-blue{color:var(--blue-m)}.c-amber{color:var(--amber)}.c-red{color:var(--red)}.c-teal{color:var(--teal)}
/* TABLE */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:7px 10px;background:var(--gray-l);color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.cat-row td{background:var(--gray-l);font-weight:600;font-size:12px;color:var(--muted);padding:5px 10px}
/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--teal-l);color:var(--teal)}.b-low{background:var(--amber-l);color:var(--amber)}
.b-empty{background:var(--red-l);color:var(--red)}.b-none{background:var(--gray-l);color:var(--muted)}
/* BUTTONS */
.btn{padding:8px 16px;border-radius:var(--rs);border:1px solid var(--border);background:#fff;color:var(--text);font-size:13px;font-weight:500;cursor:pointer}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-order{background:var(--amber-l);color:var(--amber);border-color:#f0c070}
.btn-ordered{background:var(--blue-l);color:var(--blue);border-color:#aac4e8}
.btn-confirm{background:var(--teal-l);color:var(--teal);border-color:#7ecbb5}
.btn-red{background:var(--red-l);color:var(--red);border-color:#f5a9a0}
/* INPUTS */
select,input{padding:9px 11px;border:1px solid var(--border);border-radius:var(--rs);font-size:14px;background:#fff;color:var(--text);width:100%}
select:focus,input:focus{outline:none;border-color:var(--blue-m);box-shadow:0 0 0 2px rgba(58,114,196,.15)}
input[type=number]{-moz-appearance:textfield;text-align:center;width:70px}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
/* FORM */
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.fl{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px 20px 36px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
.modal h2{font-size:17px;font-weight:700;margin-bottom:3px}
.modal .sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.mc{float:right;background:var(--gray-l);border:none;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;line-height:28px;text-align:center}
/* HARASSE PICKER */
.hrow{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0}
.hbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hval{font-size:22px;font-weight:700;min-width:70px;text-align:center}
.hunit{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
/* HERKUNFT */
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.hkbtn{padding:12px 8px;border:1.5px solid var(--border);border-radius:var(--r);background:#fff;cursor:pointer;text-align:center}
.hkbtn.sel{border-color:var(--blue);background:var(--blue-l)}
.hkbtn .icon{font-size:22px;margin-bottom:4px}
.hkbtn .lbl{font-size:12px;font-weight:600}
/* SECTION */
.stitle{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
/* ALERT */
.alert{padding:10px 14px;border-radius:var(--rs);margin-bottom:8px;font-size:13px;border:1px solid}
.alert-a{background:var(--amber-l);color:var(--amber);border-color:#f0c070}
.alert-r{background:var(--red-l);color:var(--red);border-color:#f5a9a0}
/* LOG */
.log-e{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px}
.log-e:last-child{border-bottom:none}
.log-m{font-size:11px;color:var(--muted);margin-top:2px}
/* FAB */
.fabs{position:fixed;bottom:24px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:50}
.fab{width:52px;height:52px;border-radius:50%;border:none;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
.fab-b{background:var(--blue)}.fab-t{background:var(--teal)}
/* KLEIN BANNER */
.kbanner{background:var(--teal-l);border:1px solid #b0ddd0;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;font-size:13px;color:var(--teal)}
/* SOLL INPUT */
.soll-inp{width:60px;padding:4px 6px;border:1px solid var(--border);border-radius:var(--rs);font-size:13px;text-align:center;background:#fff}
/* DIFF */
.dp{color:var(--teal);font-size:11px;font-weight:600}
.dm{color:var(--red);font-size:11px;font-weight:600}
/* PRINT */
@media print{.topbar,.subnav,.sync,.tabs,.fabs,.overlay{display:none!important}.content{padding:0}}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ═══════════════════════════════
// PRODUKTE
// ═══════════════════════════════
const SCHIFFE_L = ['Bootshaus','MS Rhystern','MS Rhenus','MS Hecht'];
const SCHIFFE_K = ['MW Neptun','MW Nautilus','MS Flipper'];
const ALLE      = [...SCHIFFE_L,...SCHIFFE_K];

const SOFT = [
  {nr:'10301',name:'Rivella Rot Glas MW',geb:'24x33cl',chf:25.91},
  {nr:'10406',name:'Eptinger rot m. Kohlens.',geb:'12x1l',chf:12.75},
  {nr:'10641',name:'Schweppes Indian Tonic',geb:'30x20cl',chf:28.30},
  {nr:'10742',name:'Eptinger blau o. Kohlens.',geb:'12x1l',chf:12.75},
  {nr:'14381',name:'Red Bull Original',geb:'24x25cl',chf:28.67},
  {nr:'15273',name:'Eptinger blau 33cl',geb:'24x33cl',chf:21.62},
  {nr:'39390',name:'Möhl Saft alkoholfrei',geb:'15x50cl',chf:22.69},
  {nr:'52833',name:'Calanda Radler',geb:'24x33cl',chf:28.46},
  {nr:'10309',name:'Elmer Citro',geb:'24x33cl',chf:21.06},
  {nr:'39167',name:'Schweppes Ginger Ale PET',geb:'4x6x50cl',chf:30.95},
  {nr:'42837',name:'Appenzeller Leermond Alkoholfrei',geb:'24x33cl',chf:44.40},
  {nr:'56077',name:'Vivi Kola Zéro',geb:'24x33cl',chf:37.44},
  {nr:'56078',name:'Vivi Kola Original',geb:'24x33cl',chf:37.44},
  {nr:'67355',name:'Vivi Soda BIO Apfelschorle',geb:'24x33cl',chf:37.74},
  {nr:'67356',name:'Vivi Soda BIO Zitrone Ingwer',geb:'24x33cl',chf:37.74},
  {nr:'10306',name:'Eptinger rot 33cl',geb:'24x33cl',chf:21.62},
  {nr:'62276',name:'Vivitz Bio Eistee Zitrone',geb:'4x6x50cl',chf:48.20},
  {nr:'68737',name:'Vivi BIO Mate Cascara',geb:'24x33cl',chf:37.74},
  {nr:'10707',name:'Ramseier Orangensaft',geb:'12x1l',chf:28.04},
];
const WEIN = [
  {kat:'Schaumwein',name:'Secco alkoholfrei (Kellerei Rahm)',vol:'7.5dl'},
  {kat:'Schaumwein',name:'Prosecco Contessa Giulia IT',vol:'7.0dl'},
  {kat:'Weisswein',name:'Teufener Surprise',vol:'5.0dl'},
  {kat:'Weisswein',name:'Teufener Riesling x Sylvaner',vol:'7.5dl'},
  {kat:'Weisswein',name:'Teufener Federweiss (Blanc de Noir)',vol:'7.5dl'},
  {kat:'Weisswein',name:'Teufener Pinot Gris',vol:'7.5dl'},
  {kat:'Weisswein',name:'Freiensteiner Riesling x Sylvaner Auslese',vol:'7.5dl'},
  {kat:'Weisswein',name:'Eglisauer Riesling x Sylvaner',vol:'7.0dl'},
  {kat:'Weisswein',name:'Eglisauer Räuschling',vol:'7.5dl'},
  {kat:'Weisswein',name:'Rüdlinger Federweiss',vol:'5.0dl'},
  {kat:'Weisswein',name:'Buchberger Riesling x Sylvaner',vol:'7.5dl'},
  {kat:'Weisswein',name:'Chardonnay California',vol:'7.5dl'},
  {kat:'Rosé',name:'Buchberger Rosé',vol:'5.0dl'},
  {kat:'Rotwein',name:'Teufener Blauburgunder classique',vol:'7.5dl'},
  {kat:'Rotwein',name:'Freiensteiner Pinot Schwarz 12',vol:'7.5dl'},
  {kat:'Rotwein',name:'Eglisauer Pinot Noir Auslese',vol:'7.5dl'},
  {kat:'Rotwein',name:'Eglisauer Pinot Noir Selection Stadtberg',vol:'7.5dl'},
  {kat:'Rotwein',name:'Rüdlinger Pinot Noir aus alten Reben',vol:'5.0dl'},
  {kat:'Rotwein',name:'Buchberger Blauburgunder 5dl',vol:'5.0dl'},
  {kat:'Rotwein',name:'Buchberger Blauburgunder 7dl',vol:'7.0dl'},
  {kat:'Rotwein',name:'Cabernet Sauvignon California',vol:'7.5dl'},
  {kat:'Rotwein',name:'Salento IGT Primitivo – Conti Zecca',vol:'7.5dl'},
];

// ═══════════════════════════════
// STATE
// ═══════════════════════════════
function initState(){
  const s={};
  SCHIFFE_L.forEach(st=>{
    s[st]={
      soft:SOFT.map(()=>({bestand:0,soll:0,bestellt:0,updated:'',_id:null})),
      wein:WEIN.map(()=>({bestand:0,soll:0,bestellt:0,updated:'',_id:null})),
    };
  });
  return s;
}
function loadLocal(){
  try{
    const s=localStorage.getItem('szr_v4');
    const l=localStorage.getItem('szr_log_v4');
    if(l) log=JSON.parse(l);
    return s?JSON.parse(s):initState();
  }catch(e){return initState();}
}
function saveLocal(){
  try{
    localStorage.setItem('szr_v4',JSON.stringify(state));
    localStorage.setItem('szr_log_v4',JSON.stringify(log.slice(0,300)));
  }catch(e){}
}

let state=loadLocal();
let log=[];
try{log=JSON.parse(localStorage.getItem('szr_log_v4')||'[]');}catch(e){}

// UI
let mode='boot', activeIdx=0, activeTab='soft', modal=null, syncStatus='offline';
// Modal forms
let zF={typ:'soft',art:0,menge:0.5,herkunft:'lieferung',vonSchiff:'Bootshaus'};
let aF={typ:'soft',art:0,menge:0.5};
let bF={schiff:'MW Neptun',typ:'soft',art:0,menge:0.5};

// ═══════════════════════════════
// HELPERS
// ═══════════════════════════════
function fmtH(v,typ){
  const u=typ==='wein'?'Einh.':'Hr.';
  if(v===0)return '0 '+u;
  if(v%1===0)return v+' '+u;
  return '½ '+u;
}
function badge(b,s){
  if(b<=0)return '<span class="badge b-empty">Leer</span>';
  if(s>0&&b<s)return '<span class="badge b-low">Tief</span>';
  if(s>0&&b>=s)return '<span class="badge b-ok">OK</span>';
  return '<span class="badge b-ok">OK</span>';
}
function fmtT(iso){
  if(!iso)return '–';
  try{const d=new Date(iso);return d.toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});}
  catch(e){return '';}
}
function now(){return new Date().toISOString();}
function addLog(e){log.unshift({...e,zeit:now()});saveLocal();}
function schiff(){return ALLE[activeIdx];}
function isKlein(){return SCHIFFE_K.includes(schiff());}

// ═══════════════════════════════
// SHAREPOINT
// ═══════════════════════════════
const SP='https://schiffzueri.sharepoint.com/sites/SZRLager/_api/web/lists';
let tok=null;
async function getTok(){
  try{
    const r=await fetch('https://schiffzueri.sharepoint.com/sites/SZRLager/_api/contextinfo',
      {method:'POST',headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose'},credentials:'include'});
    if(!r.ok)throw 0;
    tok=(await r.json()).d.GetContextWebInformation.FormDigestValue;
    return true;
  }catch(e){syncStatus='offline';return false;}
}
async function spGet(l){
  try{const r=await fetch(`${SP}/getbytitle('${l}')/items?$top=500`,{headers:{'Accept':'application/json;odata=verbose'},credentials:'include'});
    return r.ok?(await r.json()).d.results:null;}catch(e){return null;}
}
async function spAdd(l,item){
  if(!tok)await getTok();
  try{const r=await fetch(`${SP}/getbytitle('${l}')/items`,{method:'POST',
    headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose','X-RequestDigest':tok},
    credentials:'include',body:JSON.stringify({'__metadata':{'type':`SP.Data.${l}ListItem`},...item})});
    return r.ok;}catch(e){return false;}
}
async function spUpd(l,id,item){
  if(!tok)await getTok();
  try{const r=await fetch(`${SP}/getbytitle('${l}')/items(${id})`,{method:'MERGE',
    headers:{'Accept':'application/json;odata=verbose','Content-Type':'application/json;odata=verbose','X-RequestDigest':tok,'IF-MATCH':'*','X-HTTP-Method':'MERGE'},
    credentials:'include',body:JSON.stringify({'__metadata':{'type':`SP.Data.${l}ListItem`},...item})});
    return r.ok;}catch(e){return false;}
}
async function syncSP(){
  syncStatus='syncing';render();
  const items=await spGet('SZR_Lagerbestand');
  if(!items){syncStatus='offline';render();return;}
  items.forEach(it=>{
    const st=it.Standort,typ=it.TypLager,idx=parseInt(it.ArtikelIndex);
    if(state[st]&&state[st][typ]&&state[st][typ][idx]!==undefined){
      state[st][typ][idx].bestand=parseFloat(it.Bestand)||0;
      state[st][typ][idx].soll=parseFloat(it.Soll)||0;
      state[st][typ][idx].bestellt=it.Bestellt?1:0;
      state[st][typ][idx].updated=it.Modified||'';
      state[st][typ][idx]._id=it.Id;
    }
  });
  const li=await spGet('SZR_Transaktionen');
  if(li)log=li.map(t=>({zeit:t.Zeitpunkt||t.Created,typ:t.Typ,von:t.Von,nach:t.Nach,artikel:t.Artikel,menge:t.Menge,einheit:t.Einheit||''})).reverse().slice(0,200);
  syncStatus='ok';saveLocal();render();
}
async function pushRow(st,typ,idx){
  const r=state[st][typ][idx];
  const item={Standort:st,TypLager:typ,ArtikelIndex:idx,Bestand:r.bestand,Soll:r.soll,Bestellt:r.bestellt===1};
  if(r._id)spUpd('SZR_Lagerbestand',r._id,item);
  else{const ok=await spAdd('SZR_Lagerbestand',item);if(ok)syncSP();}
}
async function pushLog(e){
  spAdd('SZR_Transaktionen',{Zeitpunkt:e.zeit||now(),Typ:e.typ,Von:e.von||'',Nach:e.nach||'',Artikel:e.artikel,Menge:e.menge,Einheit:e.einheit||''});
}

// ═══════════════════════════════
// TEAMS WEBHOOK
// ═══════════════════════════════
const TEAMS_WH=''; // Webhook URL hier einfügen
async function teamsNotify(schiffName,artikelName,typ){
  if(!TEAMS_WH)return;
  const einheit=typ==='wein'?'6er-Einheiten':'Harassen';
  try{await fetch(TEAMS_WH,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:`🚢 **Bestellung von ${schiffName}**\n📦 ${artikelName} (${einheit})\n⏰ ${fmtT(now())}`})});}
  catch(e){}
}

// ═══════════════════════════════
// BUSINESS LOGIC
// ═══════════════════════════════
function adjust(st,typ,idx,delta){
  const r=state[st][typ][idx];
  r.bestand=Math.max(0,Math.round((r.bestand+delta)*2)/2);
  r.updated=now();
  pushRow(st,typ,idx);
  saveLocal();
}

function doZubuchung(){
  const {typ,art,menge,herkunft,vonSchiff}=zF;
  const st=schiff();
  const name=typ==='soft'?SOFT[art].name:WEIN[art].name;
  const einheit=typ==='wein'?'Einh.':'Hr.';
  // Ziel erhält Menge
  adjust(st,typ,art,+menge);
  // Quelle verliert Menge
  if(herkunft==='bootshaus'&&state['Bootshaus'])adjust('Bootshaus',typ,art,-menge);
  else if(herkunft==='schiff'&&state[vonSchiff])adjust(vonSchiff,typ,art,-menge);
  const von=herkunft==='lieferung'?'Lieferung (extern)':herkunft==='bootshaus'?'Bootshaus':vonSchiff;
  const e={typ:'Zubuchung',von,nach:st,artikel:name,menge,einheit};
  addLog(e);pushLog(e);
}

function doAbgang(){
  const {typ,art,menge}=aF;
  const st=schiff();
  const name=typ==='soft'?SOFT[art].name:WEIN[art].name;
  const einheit=typ==='wein'?'Einh.':'Hr.';
  adjust(st,typ,art,-menge);
  const e={typ:'Verbrauch',von:st,nach:'',artikel:name,menge,einheit};
  addLog(e);pushLog(e);
}

function doBezug(){
  const {schiff:s,typ,art,menge}=bF;
  const name=typ==='soft'?SOFT[art].name:WEIN[art].name;
  const einheit=typ==='wein'?'Einh.':'Hr.';
  if(state['Bootshaus'])adjust('Bootshaus',typ,art,-menge);
  const e={typ:'Bezug kl.Schiff',von:'Bootshaus',nach:s,artikel:name,menge,einheit};
  addLog(e);pushLog(e);
}

function setSoll(st,typ,idx,val){
  state[st][typ][idx].soll=parseFloat(val)||0;
  pushRow(st,typ,idx);saveLocal();render();
}

function toggleOrder(typ,idx){
  const st=schiff();
  if(!SCHIFFE_L.includes(st))return;
  const r=state[st][typ][idx];
  r.bestellt=r.bestellt?0:1;
  r.updated=now();
  if(r.bestellt){
    const name=typ==='soft'?SOFT[idx].name:WEIN[idx].name;
    teamsNotify(st,name,typ);
  }
  pushRow(st,typ,idx);saveLocal();render();
}

function confirmOrder(st,typ,idx){
  state[st][typ][idx].bestellt=0;
  pushRow(st,typ,idx);saveLocal();render();
}

// ═══════════════════════════════
// RENDER
// ═══════════════════════════════
function render(){
  const syncBar=syncStatus==='syncing'
    ?`<div class="sync ok"><div class="sync-dot"></div>Synchronisiere…</div>`
    :syncStatus==='ok'
    ?`<div class="sync ok"><div class="sync-dot"></div>Verbunden · SharePoint SZR Lager · letzte Sync ${fmtT(now())}</div>`
    :`<div class="sync err"><div class="sync-dot"></div>Offline – Daten lokal <button class="btn btn-sm" style="margin-left:8px" onclick="syncSP()">Erneut</button></div>`;

  document.getElementById('root').innerHTML=
    `<div class="topbar"><h1>SZR <span>Lagerverwaltung</span></h1>
      <div class="mode-toggle">
        <button class="mode-btn ${mode==='boot'?'active':''}" onclick="setMode('boot')">Schiff</button>
        <button class="mode-btn ${mode==='buero'?'active':''}" onclick="setMode('buero')">Büro</button>
      </div></div>${syncBar}`
    +(mode==='boot'?renderBoot():renderBuero())
    +(modal?renderModal():'');
}

function renderBoot(){
  const nav=ALLE.map((s,i)=>`<button class="snb ${SCHIFFE_K.includes(s)?'klein':''} ${i===activeIdx?'active':''}" onclick="setSchiff(${i})">${s}</button>`).join('');
  const tabs=!isKlein()?`<div class="tabs">
    <button class="tab ${activeTab==='soft'?'active':''}" onclick="setTab('soft')">Softgetränke</button>
    <button class="tab ${activeTab==='wein'?'active':''}" onclick="setTab('wein')">Wein (6er)</button>
    <button class="tab ${activeTab==='log'?'active':''}" onclick="setTab('log')">Aktivität</button>
  </div>`:'';
  const content=isKlein()?renderKlein():activeTab==='log'?renderLog(schiff()):renderTabelle(schiff(),activeTab);
  const fabs=isKlein()
    ?`<div class="fabs"><button class="fab fab-t" onclick="openBezug()" title="Bezug aus Bootshaus">⇄</button></div>`
    :`<div class="fabs">
        <button class="fab fab-t" onclick="openAbgang()" title="Verbrauch / Abgang" style="font-size:26px;font-weight:300">−</button>
        <button class="fab fab-b" onclick="openZubuchung()" title="Zubuchung / Auffüllen" style="font-size:26px;font-weight:300">+</button>
      </div>`;
  return `<div class="subnav">${nav}</div>${tabs}<div class="content">${content}</div>${fabs}`;
}

function renderTabelle(st,typ){
  const d=state[st];
  const items=typ==='soft'?SOFT:WEIN;
  const unit=typ==='wein'?'Einheiten (6 Fl.)':'Harassen';
  let h=`<div style="font-size:12px;color:var(--muted);margin-bottom:8px">Einheit: <strong>${unit}</strong></div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:10px">
    <strong>+</strong> Button = Zubuchung (woher?) &nbsp;|&nbsp; <strong>−</strong> Button = Verbrauch
  </div>
  <div class="card"><div class="tw"><table><thead><tr>
    <th>Artikel</th><th style="text-align:center">Ist</th><th style="text-align:center">Soll</th>
    <th style="text-align:center">Status</th><th style="text-align:center">Aktion</th><th style="text-align:center">Zuletzt</th>
  </tr></thead><tbody>`;
  let lastKat='';
  items.forEach((p,i)=>{
    const r=d[typ][i];
    if(typ==='wein'&&p.kat!==lastKat){h+=`<tr class="cat-row"><td colspan="6">${p.kat}</td></tr>`;lastKat=p.kat;}
    const diff=r.soll>0?r.bestand-r.soll:null;
    const diffHtml=diff!==null?`<span class="${diff>=0?'dp':'dm'}" style="margin-left:4px">${diff>=0?'+':''}${diff}</span>`:'';
    h+=`<tr>
      <td><small style="color:var(--muted)">${typ==='soft'?p.nr:p.kat}</small><br><strong>${p.name}</strong><br><span style="font-size:11px;color:var(--muted)">${typ==='soft'?p.geb:p.vol+' · 6er-Einheit'}</span></td>
      <td style="text-align:center;font-size:16px;font-weight:700">${fmtH(r.bestand,typ)}${diffHtml}</td>
      <td style="text-align:center">${fmtH(r.soll,typ)}</td>
      <td style="text-align:center">${badge(r.bestand,r.soll)}</td>
      <td style="text-align:center;white-space:nowrap">
        <button class="btn btn-sm btn-red" style="margin-right:4px" onclick="quickAbgang('${typ}',${i})">−</button>
        <button class="btn btn-sm btn-p" onclick="quickZubuchung('${typ}',${i})">+</button>
      </td>
      <td style="text-align:center;font-size:11px;color:var(--muted)">${fmtT(r.updated)}</td>
    </tr>`;
  });
  h+='</tbody></table></div></div>';

  // Bestellbutton Sektion
  h+=`<div class="stitle">Bestellung ans Büro melden</div><div class="card"><div class="tw"><table><thead><tr>
    <th>Artikel</th><th style="text-align:center">Ist</th><th style="text-align:center">Soll</th><th style="text-align:center">Bestellen</th>
  </tr></thead><tbody>`;
  lastKat='';
  items.forEach((p,i)=>{
    const r=d[typ][i];
    if(typ==='wein'&&p.kat!==lastKat){h+=`<tr class="cat-row"><td colspan="4">${p.kat}</td></tr>`;lastKat=p.kat;}
    if(r.bestand<r.soll||r.bestellt){
      h+=`<tr><td>${p.name}</td>
        <td style="text-align:center">${fmtH(r.bestand,typ)}</td>
        <td style="text-align:center">${fmtH(r.soll,typ)}</td>
        <td style="text-align:center"><button class="btn btn-sm ${r.bestellt?'btn-ordered':'btn-order'}" onclick="toggleOrder('${typ}',${i})">${r.bestellt?'✓ Gemeldet':'Bestellen'}</button></td>
      </tr>`;
    }
  });
  h+='</tbody></table></div></div>';
  return h;
}

function renderKlein(){
  const st=schiff();
  const stLog=log.filter(e=>e.von===st||e.nach===st).slice(0,20);
  let h=`<div class="kbanner"><strong>${st}</strong> — kein eigenes Lager.<br>Getränke werden aus dem <strong>Bootshaus</strong> bezogen. Bezug hier erfassen → Bootshaus-Bestand wird automatisch angepasst.</div>`;
  h+=`<div class="stitle">Letzte Bezüge</div><div class="card">`;
  if(!stLog.length)h+=`<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">Noch keine Bezüge</div>`;
  else stLog.forEach(e=>{h+=`<div class="log-e"><strong>⇄ ${e.typ}</strong> · ${e.artikel} · ${e.menge} ${e.einheit}<div class="log-m">${e.von||'–'} → ${e.nach||'–'} · ${fmtT(e.zeit)}</div></div>`;});
  return h+'</div>';
}

function renderLog(filterSchiff){
  const items=filterSchiff?log.filter(e=>e.von===filterSchiff||e.nach===filterSchiff):log;
  let h=`<div class="card">`;
  if(!items.length)h+=`<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">Noch keine Aktivitäten</div>`;
  else items.slice(0,60).forEach(e=>{
    const icon=e.typ.includes('Zubuchung')?'↑':e.typ.includes('Verbrauch')?'↓':'⇄';
    h+=`<div class="log-e"><strong>${icon} ${e.typ}</strong> · ${e.artikel} · ${e.menge} ${e.einheit||''}<div class="log-m">${e.von||'–'} → ${e.nach||'–'} · ${fmtT(e.zeit)}</div></div>`;
  });
  return h+'</div>';
}

function renderBuero(){
  let pending=0,low=0,empty=0,kostenGes=0;
  SCHIFFE_L.forEach(st=>{
    SOFT.forEach((p,i)=>{const r=state[st].soft[i];if(r.bestellt)pending++;if(r.bestand<=0)empty++;else if(r.soll>0&&r.bestand<r.soll)low++;kostenGes+=r.bestand*p.chf;});
    WEIN.forEach((_,i)=>{const r=state[st].wein[i];if(r.bestellt)pending++;if(r.bestand<=0)empty++;else if(r.soll>0&&r.bestand<r.soll)low++;});
  });

  let alerts='';
  SCHIFFE_L.forEach(st=>{
    ['soft','wein'].forEach(typ=>{
      (typ==='soft'?SOFT:WEIN).forEach((p,i)=>{
        const r=state[st][typ][i];
        if(r.bestand<=0)alerts+=`<div class="alert alert-r"><strong>${st}</strong> · ${p.name}: Leer</div>`;
        else if(r.soll>0&&r.bestand<r.soll)alerts+=`<div class="alert alert-a"><strong>${st}</strong> · ${p.name}: ${fmtH(r.bestand,typ)} (Soll: ${fmtH(r.soll,typ)})</div>`;
      });
    });
  });

  let bestellungen='';
  SCHIFFE_L.forEach(st=>{
    const rows=[
      ...state[st].soft.map((r,i)=>({...r,name:SOFT[i].name,geb:SOFT[i].geb,i,t:'soft'})),
      ...state[st].wein.map((r,i)=>({...r,name:WEIN[i].name,i,t:'wein'}))
    ].filter(r=>r.bestellt);
    if(rows.length){
      bestellungen+=`<div class="stitle">${st}</div><div class="card"><table><thead><tr><th>Artikel</th><th>Einheit</th><th>Ist</th><th>Soll</th><th>Aktion</th></tr></thead><tbody>`;
      rows.forEach(r=>{
        bestellungen+=`<tr><td>${r.name}</td><td><span class="badge b-none">${r.t==='soft'?'Harassen':'6er-Einh.'}</span></td>
          <td>${fmtH(r.bestand,r.t)}</td><td>${fmtH(r.soll,r.t)}</td>
          <td><button class="btn btn-sm btn-confirm" onclick="confirmOrder('${st}','${r.t}',${r.i})">Bestellt ✓</button></td></tr>`;
      });
      bestellungen+='</tbody></table></div>';
    }
  });
  if(!bestellungen)bestellungen=`<div style="color:var(--muted);font-size:13px;padding:6px 0">Keine offenen Bestellungen.</div>`;

  const tabBar=`<div class="tabs" style="padding:0 0 10px">
    <button class="tab ${activeTab==='soft'?'active':''}" onclick="setTab('soft')">Softgetränke</button>
    <button class="tab ${activeTab==='wein'?'active':''}" onclick="setTab('wein')">Wein</button>
    <button class="tab ${activeTab==='log'?'active':''}" onclick="setTab('log')">Aktivität</button>
    <button class="tab" onclick="printBestellliste()">🖨️ Drucken</button>
  </div>`;

  let uebersicht='';
  if(activeTab==='log'){uebersicht=renderLog(null);}
  else{
    const items=activeTab==='soft'?SOFT:WEIN;
    uebersicht=`<div class="card"><div class="tw"><table><thead><tr><th>Artikel</th>`;
    SCHIFFE_L.forEach(st=>uebersicht+=`<th style="text-align:center">${st}<br><small style="font-weight:400;font-size:10px">Ist / Soll</small></th>`);
    uebersicht+=`</tr></thead><tbody>`;
    let lk='';
    items.forEach((p,i)=>{
      if(activeTab==='wein'&&p.kat!==lk){uebersicht+=`<tr class="cat-row"><td colspan="${1+SCHIFFE_L.length}">${p.kat}</td></tr>`;lk=p.kat;}
      uebersicht+=`<tr><td><strong>${p.name}</strong>${activeTab==='soft'?`<br><small style="color:var(--muted)">${p.nr} · ${p.geb}</small>`:''}</td>`;
      SCHIFFE_L.forEach(st=>{
        const r=state[st][activeTab][i];
        const diff=r.bestand-r.soll;
        const col=r.bestand<=0?'color:var(--red)':r.soll>0&&r.bestand<r.soll?'color:var(--amber)':'';
        const diffHtml=r.soll>0?`<span class="${diff>=0?'dp':'dm'}">${diff>=0?'+':''}${diff}</span>`:'';
        uebersicht+=`<td style="text-align:center;${col}">
          <div style="font-weight:700">${fmtH(r.bestand,activeTab)}</div>
          <div style="font-size:11px;color:var(--muted)">Soll: ${fmtH(r.soll,activeTab)} ${diffHtml}</div>
          <div style="margin-top:4px">
            <input type="number" min="0" step="0.5" value="${r.soll}" 
              onchange="setSoll('${st}','${activeTab}',${i},this.value)"
              style="width:55px;font-size:12px;padding:3px" title="Soll-Bestand setzen"/>
          </div>
        </td>`;
      });
      uebersicht+='</tr>';
    });
    uebersicht+='</tbody></table></div></div>';
  }

  // Kostenschätzung
  const kosten=`<div class="stitle">Kostenschätzung Softgetränke (Einkauf)</div>
  <div class="card"><table><thead><tr><th>Schiff</th>${SOFT.map(p=>`<th style="text-align:center;font-size:10px">${p.name.substring(0,12)}</th>`).join('')}<th style="text-align:right">Total</th></tr></thead><tbody>
  ${SCHIFFE_L.map(st=>{
    let total=0;
    const cells=SOFT.map((p,i)=>{const v=state[st].soft[i].bestand*p.chf;total+=v;return`<td style="text-align:center;font-size:12px">${v>0?'CHF '+v.toFixed(0):'–'}</td>`;}).join('');
    return`<tr><td><strong>${st}</strong></td>${cells}<td style="text-align:right;font-weight:700">CHF ${total.toFixed(0)}</td></tr>`;
  }).join('')}
  <tr style="background:var(--gray-l)"><td><strong>Total</strong></td>${SOFT.map((_,i)=>{
    let t=0;SCHIFFE_L.forEach(st=>{t+=state[st].soft[i].bestand*SOFT[i].chf;});return`<td style="text-align:center;font-size:12px;font-weight:600">${t>0?'CHF '+t.toFixed(0):'–'}</td>`;
  }).join('')}<td style="text-align:right;font-weight:700;font-size:15px">CHF ${kostenGes.toFixed(0)}</td></tr>
  </tbody></table></div>`;

  return`<div class="content">
    <div class="stats">
      <div class="stat"><div class="stat-l">Bestellungen</div><div class="stat-v c-blue">${pending}</div></div>
      <div class="stat"><div class="stat-l">Tief</div><div class="stat-v c-amber">${low}</div></div>
      <div class="stat"><div class="stat-l">Leer</div><div class="stat-v c-red">${empty}</div></div>
    </div>
    ${alerts?`<div class="stitle">Warnungen</div>${alerts}`:''}
    <div class="stitle">Offene Bestellungen</div>${bestellungen}
    <div class="stitle">Soll-Ist Übersicht (Soll hier anpassen ↓)</div>${tabBar}${uebersicht}
    ${activeTab==='soft'?kosten:''}
  </div>`;
}

// ═══════════════════════════════
// MODALS
// ═══════════════════════════════
function artSelect(form,fvar){
  const items=form.typ==='soft'?SOFT:WEIN;
  const opts=items.map((p,i)=>`<option value="${i}" ${form.art===i?'selected':''}>${p.name}</option>`).join('');
  return`<div class="fg"><div class="fl">Typ</div>
    <select onchange="${fvar}.typ=this.value;${fvar}.art=0;render()">
      <option value="soft" ${form.typ==='soft'?'selected':''}>Softgetränke (Harassen)</option>
      <option value="wein" ${form.typ==='wein'?'selected':''}>Wein (6er-Einheiten)</option>
    </select></div>
  <div class="fg"><div class="fl">Artikel</div>
    <select onchange="${fvar}.art=parseInt(this.value)">${opts}</select></div>`;
}
function mengePicker(val,fvar){
  const label=val%1!==0?'½ Harasse / ½ Einheit':'ganze Harassen / Einheiten';
  return`<div class="fg"><div class="fl">Menge</div>
    <div class="hrow">
      <button class="hbtn" onclick="${fvar}.menge=Math.max(0.5,Math.round((${fvar}.menge-0.5)*2)/2);render()">−</button>
      <div><div class="hval">${val}</div><div class="hunit">${label}</div></div>
      <button class="hbtn" onclick="${fvar}.menge=Math.round((${fvar}.menge+0.5)*2)/2;render()">+</button>
    </div></div>`;
}

function renderModal(){
  if(modal==='zubuchung'){
    const st=schiff();
    const schiffOpts=SCHIFFE_L.filter(s=>s!==st).map(s=>`<option value="${s}" ${zF.vonSchiff===s?'selected':''}>${s}</option>`).join('');
    return`<div class="overlay" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">
      <button class="mc" onclick="closeModal()">✕</button>
      <h2>Zubuchung / Auffüllen</h2><div class="sub">${st} · Woher kommen die Getränke?</div>
      ${artSelect(zF,'zF')}
      <div class="fg"><div class="fl">Herkunft</div>
        <div class="hgrid">
          ${[['lieferung','🚚','Lieferung\n(extern)'],['bootshaus','🏠','Bootshaus'],['schiff','🚢','Anderes\nSchiff']].map(([v,ic,lb])=>
            `<button class="hkbtn ${zF.herkunft===v?'sel':''}" onclick="zF.herkunft='${v}';render()">
              <div class="icon">${ic}</div><div class="lbl">${lb}</div></button>`).join('')}
        </div>
        ${zF.herkunft==='schiff'?`<div class="fg"><div class="fl">Von welchem Schiff?</div>
          <select onchange="zF.vonSchiff=this.value">${schiffOpts}</select></div>`:''}
      </div>
      ${mengePicker(zF.menge,'zF')}
      <button class="btn btn-p" style="width:100%;margin-top:8px" onclick="commitZ()">Zubuchung bestätigen ✓</button>
    </div></div>`;
  }
  if(modal==='abgang'){
    return`<div class="overlay" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">
      <button class="mc" onclick="closeModal()">✕</button>
      <h2>Verbrauch / Abgang</h2><div class="sub">${schiff()} · Wieviel wurde verbraucht?</div>
      ${artSelect(aF,'aF')}
      ${mengePicker(aF.menge,'aF')}
      <button class="btn btn-red" style="width:100%;margin-top:8px" onclick="commitA()">Abgang buchen</button>
    </div></div>`;
  }
  if(modal==='bezug'){
    const schiffOpts=SCHIFFE_K.map(s=>`<option value="${s}" ${bF.schiff===s?'selected':''}>${s}</option>`).join('');
    return`<div class="overlay" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">
      <button class="mc" onclick="closeModal()">✕</button>
      <h2>Bezug aus Bootshaus</h2><div class="sub">Bootshaus-Bestand wird automatisch reduziert</div>
      <div class="fg"><div class="fl">Schiff</div><select onchange="bF.schiff=this.value">${schiffOpts}</select></div>
      ${artSelect(bF,'bF')}
      ${mengePicker(bF.menge,'bF')}
      <button class="btn btn-p" style="width:100%;margin-top:8px" onclick="commitB()">Bezug bestätigen ✓</button>
    </div></div>`;
  }
  return'';
}

// ═══════════════════════════════
// QUICK ACTIONS (direkt aus Tabelle)
// ═══════════════════════════════
function quickZubuchung(typ,idx){zF.typ=typ;zF.art=idx;modal='zubuchung';render();}
function quickAbgang(typ,idx){aF.typ=typ;aF.art=idx;modal='abgang';render();}

// ═══════════════════════════════
// DRUCK
// ═══════════════════════════════
function printBestellliste(){
  let rows='';
  SCHIFFE_L.forEach(st=>{
    ['soft','wein'].forEach(typ=>{
      (typ==='soft'?SOFT:WEIN).forEach((p,i)=>{
        const r=state[st][typ][i];
        if(r.bestellt||r.bestand<r.soll){
          rows+=`<tr><td>${st}</td><td>${p.name}</td><td>${typ==='soft'?p.geb:'6er-Einh.'}</td>
            <td>${fmtH(r.bestand,typ)}</td><td>${fmtH(r.soll,typ)}</td>
            <td>${r.bestellt?'✓ Bestellen':''}</td></tr>`;
        }
      });
    });
  });
  const w=window.open('','_blank');
  w.document.write(`<html><head><title>SZR Bestellliste ${new Date().toLocaleDateString('de-CH')}</title>
  <style>body{font-family:sans-serif;font-size:13px}table{width:100%;border-collapse:collapse}
  th,td{border:1px solid #ccc;padding:6px 8px}th{background:#f0f0f0}h2{margin-bottom:12px}</style></head>
  <body><h2>SZR Bestellliste – ${new Date().toLocaleDateString('de-CH')}</h2>
  <table><thead><tr><th>Schiff</th><th>Artikel</th><th>Gebinde</th><th>Ist</th><th>Soll</th><th>Bestellen</th></tr></thead>
  <tbody>${rows}</tbody></table></body></html>`);
  w.print();
}

// ═══════════════════════════════
// ACTIONS
// ═══════════════════════════════
function setMode(m){mode=m;render();}
function setSchiff(i){activeIdx=i;render();}
function setTab(t){activeTab=t;render();}
function openZubuchung(){modal='zubuchung';render();}
function openAbgang(){modal='abgang';render();}
function openBezug(){modal='bezug';render();}
function closeModal(){modal=null;render();}
function commitZ(){doZubuchung();closeModal();}
function commitA(){doAbgang();closeModal();}
function commitB(){doBezug();closeModal();}

// ═══════════════════════════════
// INIT
// ═══════════════════════════════
render();
getTok().then(ok=>{if(ok)syncSP();else{syncStatus='offline';render();}});
setInterval(()=>{if(syncStatus==='ok')syncSP();},60000);
</script>
</body>
