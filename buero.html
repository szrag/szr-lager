<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SZR · Büro</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SZR Büro">
<meta name="theme-color" content="#f2f2f7">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f2f7;--bg2:#fff;--bg3:#e5e5ea;
  --blue:#007aff;--blue-l:#e8f3ff;
  --green:#34c759;--green-l:#e8f8ed;
  --orange:#ff9500;--orange-l:#fff5e6;
  --red:#ff3b30;--red-l:#ffe8e7;
  --purple:#af52de;--purple-l:#f3e8ff;
  --brown:#8b4513;--brown-l:#fdf0e6;
  --text:#1c1c1e;--text2:#3a3a3c;--text3:#6c6c70;--text4:#aeaeb2;
  --border:rgba(0,0,0,0.08);
  --sh:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --r:16px;--rs:10px;--rxs:8px;
  --font:'DM Sans',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
.hdr{background:rgba(242,242,247,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:52px 16px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.hdr-row{display:flex;align-items:center;gap:10px}
.hdr-title{font-size:19px;font-weight:700;flex:1}
.hdr-date{font-size:12px;color:var(--text3);margin-top:2px}
.sync-pill{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.sp-ok{background:var(--green-l);color:var(--green)}
.sp-err{background:var(--red-l);color:var(--red)}
.sp-off{background:var(--bg3);color:var(--text3)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.scroll{flex:1;overflow-y:auto;padding:12px 16px 100px}
.scroll::-webkit-scrollbar{display:none}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:8px 0 20px;z-index:50}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border:none;background:transparent;cursor:pointer;font-family:var(--font)}
.nav-icon{font-size:22px;line-height:1;position:relative}
.nav-label{font-size:10px;font-weight:500;color:var(--text4)}
.nav-item.active .nav-label{color:var(--blue)}
.nav-badge{position:absolute;top:-4px;right:-10px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.stat{background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.stat-icon{font-size:22px;margin-bottom:4px}
.stat-label{font-size:11px;color:var(--text3);font-weight:500}
.stat-val{font-size:26px;font-weight:700}
.stitle{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 7px}
.alert-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--rs);margin-bottom:7px;border:1px solid}
.ar-red{background:var(--red-l);border-color:rgba(255,59,48,.15);color:var(--red)}
.ar-orange{background:var(--orange-l);border-color:rgba(255,149,0,.15);color:var(--orange)}
.ar-icon{font-size:16px;flex-shrink:0}
.ar-info{flex:1}
.ar-title{font-size:13px;font-weight:700}
.ar-sub{font-size:11px;opacity:.8;margin-top:1px}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.t-ok{background:var(--green-l);color:var(--green)}
.t-warn{background:var(--orange-l);color:var(--orange)}
.t-bad{background:var(--red-l);color:var(--red)}
.schiff-row{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.schiff-row:last-child{border-bottom:none}
.sr-icon{font-size:26px;flex-shrink:0}
.sr-info{flex:1}
.sr-name{font-size:15px;font-weight:600}
.sr-sub{font-size:12px;color:var(--text3);margin-top:2px}
.status-dot{width:10px;height:10px;border-radius:50%}
.bestell-item{display:flex;align-items:center;gap:10px;padding:13px 14px;border-bottom:1px solid var(--border)}
.bestell-item:last-child{border-bottom:none}
.bi-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.bi-info{flex:1}
.bi-name{font-size:14px;font-weight:600}
.bi-detail{font-size:11px;color:var(--text3);margin-top:3px}
.bi-schiff{font-size:11px;font-weight:600;color:var(--blue);margin-top:2px}
.bi-btn{padding:6px 12px;border-radius:20px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:var(--font);background:var(--green);color:#fff}
.seg{display:flex;background:var(--bg3);border-radius:10px;padding:2px;margin-bottom:12px}
.seg-btn{flex:1;padding:6px 2px;border:none;background:transparent;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text3);font-family:var(--font)}
.seg-btn.active{background:#fff;color:var(--text);font-weight:700;box-shadow:var(--sh)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:7px 10px;background:var(--bg);color:var(--text3);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.soll-inp{width:52px;padding:4px 5px;border:1.5px solid var(--border);border-radius:var(--rxs);font-size:12px;text-align:center;background:var(--bg);color:var(--text);font-family:var(--font)}
.soll-inp:focus{outline:none;border-color:var(--blue)}
.cat-cell{background:var(--bg);font-weight:700;font-size:10px;color:var(--text3);padding:5px 10px;text-transform:uppercase;letter-spacing:.04em}
.sh-select{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:var(--rs);font-size:15px;font-family:var(--font);background:var(--bg);color:var(--text);appearance:none;margin-bottom:14px}
.kb-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border)}
.kb-row:last-child{border-bottom:none}
.kb-label{font-size:12px;font-weight:500;width:90px;flex-shrink:0}
.kb-track{flex:1;background:var(--bg3);border-radius:4px;height:7px;overflow:hidden}
.kb-fill{height:100%;border-radius:4px;background:var(--blue)}
.kb-val{font-size:12px;font-weight:600;width:60px;text-align:right;flex-shrink:0}
.log-item{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)}
.log-item:last-child{border-bottom:none}
.log-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:3px}
.log-body{flex:1}
.log-title{font-size:13px;font-weight:600}
.log-sub{font-size:11px;color:var(--text3);margin-top:2px}
.log-time{font-size:10px;color:var(--text4);margin-top:3px}
.print-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:var(--rs);border:1.5px solid var(--border);background:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);margin-top:8px}
.empty{padding:36px 20px;text-align:center}
.empty-icon{font-size:40px;margin-bottom:10px}
.empty-title{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:5px}
.empty-sub{font-size:13px;color:var(--text3)}
@media print{.hdr,.bottom-nav,.print-btn{display:none!important}.scroll{padding:0}}
</style>
</head>
<body>
<div style="display:flex;flex-direction:column;min-height:100vh">
<div class="hdr">
  <div class="hdr-row">
    <div style="flex:1">
      <div class="hdr-title">SZR Büro</div>
      <div class="hdr-date" id="hdr-date"></div>
    </div>
    <div class="sync-pill sp-off" id="sync-pill" onclick="doSync()">
      <div class="sync-dot"></div><span id="sync-txt">Offline</span>
    </div>
  </div>
</div>
<div class="scroll" id="main-scroll" style="flex:1">
  <div style="padding:40px;text-align:center;color:var(--text3)">Wird geladen…</div>
</div>
<div class="bottom-nav">
  <button class="nav-item active" id="nav-dashboard" onclick="setPage('dashboard',this)">
    <div class="nav-icon">📊</div><div class="nav-label">Dashboard</div>
  </button>
  <button class="nav-item" id="nav-bestell" onclick="setPage('bestell',this)">
    <div class="nav-icon" style="position:relative">📦<span class="nav-badge" id="bestell-badge" style="display:none">0</span></div>
    <div class="nav-label">Bestellungen</div>
  </button>
  <button class="nav-item" id="nav-soll" onclick="setPage('soll',this)">
    <div class="nav-icon">🎯</div><div class="nav-label">Soll-Bestände</div>
  </button>
  <button class="nav-item" id="nav-statistik" onclick="setPage('statistik',this)">
    <div class="nav-icon">📈</div><div class="nav-label">Statistik</div>
  </button>
  <button class="nav-item" id="nav-log" onclick="setPage('log',this)">
    <div class="nav-icon">📋</div><div class="nav-label">Aktivität</div>
  </button>
</div>
</div>

<script>
const SCHIFFE_L=[
  {id:'Bootshaus',name:'Bootshaus',icon:'🏠',type:'Hauptlager'},
  {id:'MS Rhystern',name:'MS Rhystern',icon:'🚢',type:'Grosses Schiff'},
  {id:'MS Rhenus',name:'MS Rhenus',icon:'🚢',type:'Grosses Schiff'},
  {id:'MS Hecht',name:'MS Hecht',icon:'🚤',type:'Schiff'},
];
const KATEGORIEN=[
  {id:'soft',label:'Softgetränke',einheit:'Hr.',color:'var(--blue)'},
  {id:'wein',label:'Wein',einheit:'6er-Einh.',color:'var(--purple)'},
  {id:'bier',label:'Bier',einheit:'20er-Krt.',color:'var(--brown)'},
  {id:'spirits',label:'Spirituosen',einheit:'Fl.',color:'var(--orange)'},
];
const PRODUKTE={
  soft:[
    {nr:'10301',name:'Rivella Rot',geb:'24x33cl',chf:25.91},
    {nr:'10406',name:'Eptinger rot m. Kohlens.',geb:'12x1l',chf:12.75},
    {nr:'10641',name:'Schweppes Indian Tonic',geb:'30x20cl',chf:28.30},
    {nr:'10742',name:'Eptinger blau o. Kohlens.',geb:'12x1l',chf:12.75},
    {nr:'14381',name:'Red Bull Original',geb:'24x25cl',chf:28.67},
    {nr:'15273',name:'Eptinger blau 33cl',geb:'24x33cl',chf:21.62},
    {nr:'39390',name:'Möhl Saft alkoholfrei',geb:'15x50cl',chf:22.69},
    {nr:'52833',name:'Calanda Radler',geb:'24x33cl',chf:28.46},
    {nr:'10309',name:'Elmer Citro',geb:'24x33cl',chf:21.06},
    {nr:'39167',name:'Schweppes Ginger Ale',geb:'4x6x50cl',chf:30.95},
    {nr:'42837',name:'Appenzeller Leermond',geb:'24x33cl',chf:44.40},
    {nr:'56077',name:'Vivi Kola Zéro',geb:'24x33cl',chf:37.44},
    {nr:'56078',name:'Vivi Kola Original',geb:'24x33cl',chf:37.44},
    {nr:'67355',name:'Vivi Soda BIO Apfelschorle',geb:'24x33cl',chf:37.74},
    {nr:'67356',name:'Vivi Soda BIO Zitrone Ingwer',geb:'24x33cl',chf:37.74},
    {nr:'10306',name:'Eptinger rot 33cl',geb:'24x33cl',chf:21.62},
    {nr:'62276',name:'Vivitz Bio Eistee',geb:'4x6x50cl',chf:48.20},
    {nr:'68737',name:'Vivi BIO Mate Cascara',geb:'24x33cl',chf:37.74},
    {nr:'10707',name:'Ramseier Orangensaft',geb:'12x1l',chf:28.04},
  ],
  wein:[
    {kat:'Schaumwein',name:'Secco alkoholfrei (Kellerei Rahm)'},
    {kat:'Schaumwein',name:'Prosecco Contessa Giulia IT'},
    {kat:'Weisswein',name:'Teufener Surprise'},
    {kat:'Weisswein',name:'Teufener Riesling x Sylvaner'},
    {kat:'Weisswein',name:'Teufener Federweiss (Blanc de Noir)'},
    {kat:'Weisswein',name:'Teufener Pinot Gris'},
    {kat:'Weisswein',name:'Freiensteiner Riesling x Sylvaner Auslese'},
    {kat:'Weisswein',name:'Eglisauer Riesling x Sylvaner'},
    {kat:'Weisswein',name:'Eglisauer Räuschling'},
    {kat:'Weisswein',name:'Rüdlinger Federweiss'},
    {kat:'Weisswein',name:'Buchberger Riesling x Sylvaner'},
    {kat:'Weisswein',name:'Chardonnay California'},
    {kat:'Rosé',name:'Buchberger Rosé'},
    {kat:'Rotwein',name:'Teufener Blauburgunder classique'},
    {kat:'Rotwein',name:'Freiensteiner Pinot Schwarz 12'},
    {kat:'Rotwein',name:'Eglisauer Pinot Noir Auslese'},
    {kat:'Rotwein',name:'Eglisauer Pinot Noir Selection Stadtberg'},
    {kat:'Rotwein',name:'Rüdlinger Pinot Noir aus alten Reben'},
    {kat:'Rotwein',name:'Buchberger Blauburgunder 5dl'},
    {kat:'Rotwein',name:'Buchberger Blauburgunder 7dl'},
    {kat:'Rotwein',name:'Cabernet Sauvignon California'},
    {kat:'Rotwein',name:'Salento IGT Primitivo – Conti Zecca'},
  ],
  bier:[
    {name:'ST. Laurentius Hell Lager',geb:'20x33cl'},
    {name:'ST. Laurentius Liquid Sunshine',geb:'20x33cl'},
  ],
  spirits:[
    {name:'Aperol',geb:'1 Fl.'},
    {name:'Martini',geb:'1 Fl.'},
    {name:'Campari',geb:'1 Fl.'},
    {name:'Kirschwasser',geb:'1 Fl.'},
    {name:'Williamsbirne',geb:'1 Fl.'},
    {name:'Baileys',geb:'1 Fl.'},
    {name:'Gin',geb:'1 Fl.'},
    {name:'Limoncello',geb:'1 Fl.'},
    {name:'Grappa',geb:'1 Fl.'},
  ],
};

// SUPABASE
const SB='https://ezgkryebktbamxyhemkv.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6Z2tyeWVia3RiYW14eWhlbWt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0ODY4ODksImV4cCI6MjA5MzA2Mjg4OX0.CZ0E_aCoCscgn4giXMgKoGhnKdgivrK9fgURbM0EKM0';
const H={'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY};
async function sbGet(t,q=''){try{const r=await fetch(`${SB}/rest/v1/${t}?${q}&limit=2000`,{headers:{...H,'Accept':'application/json'}});return r.ok?await r.json():null;}catch(e){return null;}}
async function rpc(fn,params){try{await fetch(`${SB}/rest/v1/rpc/${fn}`,{method:'POST',headers:H,body:JSON.stringify(params)});}catch(e){}}

// STATE
function initState(){const s={};SCHIFFE_L.forEach(({id})=>{s[id]={};KATEGORIEN.forEach(k=>{s[id][k.id]=PRODUKTE[k.id].map(()=>({bestand:0,soll:0,bestellt:0}));});});return s;}
let state,log=[];
try{state=JSON.parse(localStorage.getItem('szr_v5')||'null')||initState();}catch(e){state=initState();}
try{log=JSON.parse(localStorage.getItem('szr_log_v5')||'[]');}catch(e){}
function save(){try{localStorage.setItem('szr_v5',JSON.stringify(state));localStorage.setItem('szr_log_v5',JSON.stringify(log.slice(0,300)));}catch(e){}}

let curPage='dashboard',sollKat='soft',sollSchiff='MS Rhystern';

// SYNC — always trust DB
let isSyncing=false;
async function doSync(){
  if(isSyncing)return;
  isSyncing=true;
  const pill=document.getElementById('sync-pill');
  const txt=document.getElementById('sync-txt');
  if(pill)pill.className='sync-pill sp-ok';
  if(txt)txt.textContent='Synchronisiere…';
  const items=await sbGet('lagerbestand2');
  if(items){
    items.forEach(it=>{
      const{standort,kat,artikel_index:idx,bestand,soll,bestellt}=it;
      if(state[standort]&&state[standort][kat]&&state[standort][kat][idx]!==undefined){
        state[standort][kat][idx].bestand=parseFloat(bestand)||0;
        state[standort][kat][idx].soll=parseFloat(soll)||0;
        state[standort][kat][idx].bestellt=bestellt?1:0;
      }
    });
  }
  const li=await sbGet('transaktionen2','order=zeitpunkt.desc');
  if(li)log=li.map(t=>({zeit:t.zeitpunkt,typ:t.typ,von:t.von,nach:t.nach,artikel:t.artikel,menge:t.menge,einheit:t.einheit,kat:t.kat})).slice(0,200);
  save();
  if(pill)pill.className=items?'sync-pill sp-ok':'sync-pill sp-err';
  if(txt)txt.textContent=items?('Verbunden · '+fmtT(new Date().toISOString())):'Offline';
  isSyncing=false;
  renderPage();updateBadge();
}

// HELPERS
function now(){return new Date().toISOString();}
function fmtH(v,kat){const u=KATEGORIEN.find(k=>k.id===kat)?.einheit||'';if(v===0)return'0 '+u;if(v%1===0)return v+' '+u;return'½ '+u;}
function fmtT(iso){if(!iso)return'–';try{const d=new Date(iso);return d.toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
function getStatus(b,s){if(b<=0)return'bad';if(s>0&&b<s)return'warn';return'ok';}
function statusCol(s){return s==='bad'?'var(--red)':s==='warn'?'var(--orange)':'var(--green)';}
function schiffStatus(id){if(!state[id])return'ok';let w='ok';KATEGORIEN.forEach(k=>{state[id][k.id].forEach(r=>{const s=getStatus(r.bestand,r.soll);if(s==='bad')w='bad';else if(s==='warn'&&w!=='bad')w='warn';});});return w;}
function totalPending(){let n=0;SCHIFFE_L.forEach(({id})=>{if(state[id])KATEGORIEN.forEach(k=>{state[id][k.id].forEach(r=>{if(r.bestellt)n++;});});});return n;}

// NAV
function setPage(p,btn){curPage=p;document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderPage();}
function updateBadge(){const n=totalPending();const b=document.getElementById('bestell-badge');if(b){if(n>0){b.style.display='flex';b.textContent=n;}else b.style.display='none';}}
function renderPage(){
  const s=document.getElementById('main-scroll');
  if(curPage==='dashboard')s.innerHTML=renderDashboard();
  else if(curPage==='bestell')s.innerHTML=renderBestell();
  else if(curPage==='soll')s.innerHTML=renderSoll();
  else if(curPage==='statistik')s.innerHTML=renderStatistik();
  else s.innerHTML=renderLog();
  updateBadge();
}

// DASHBOARD
function renderDashboard(){
  let pending=totalPending(),empty=0,low=0,totalChf=0;
  const warnings=[];
  SCHIFFE_L.forEach(({id,name,icon})=>{
    if(!state[id])return;
    KATEGORIEN.forEach(k=>{
      state[id][k.id].forEach((r,i)=>{
        if(k.id==='soft')totalChf+=r.bestand*(PRODUKTE.soft[i].chf||0);
        const st=getStatus(r.bestand,r.soll);
        if(st==='bad')empty++;
        else if(st==='warn')low++;
        if(st!=='ok')warnings.push({schiff:name,icon,artikel:PRODUKTE[k.id][i].name,kat:k.id,katLabel:k.label,r,st});
      });
    });
  });

  const warnHTML=warnings.length===0
    ?`<div class="empty" style="padding:20px"><div class="empty-icon">✅</div><div class="empty-title">Alles OK!</div></div>`
    :warnings.slice(0,20).map(w=>`<div class="alert-row ${w.st==='bad'?'ar-red':'ar-orange'}">
        <div class="ar-icon">${w.st==='bad'?'🔴':'🟠'}</div>
        <div class="ar-info">
          <div class="ar-title">${w.icon} ${w.schiff} · ${w.artikel}</div>
          <div class="ar-sub">${w.katLabel} · Ist: ${fmtH(w.r.bestand,w.kat)} · Soll: ${fmtH(w.r.soll,w.kat)}</div>
        </div>
        <span class="tag ${w.st==='bad'?'t-bad':'t-warn'}">${w.st==='bad'?'Leer':'Tief'}</span>
      </div>`).join('');

  return`
    <div class="stat-grid">
      <div class="stat"><div class="stat-icon">📦</div><div class="stat-label">Bestellungen</div><div class="stat-val" style="color:var(--blue)">${pending}</div></div>
      <div class="stat"><div class="stat-icon">⚠️</div><div class="stat-label">Warnungen</div><div class="stat-val" style="color:${empty>0?'var(--red)':'var(--orange)'}">${empty+low}</div></div>
      <div class="stat"><div class="stat-icon">💰</div><div class="stat-label">Soft-Lager (EK)</div><div class="stat-val" style="color:var(--purple);font-size:18px">CHF ${totalChf.toFixed(0)}</div></div>
      <div class="stat"><div class="stat-icon">🍺</div><div class="stat-label">Kategorien</div><div class="stat-val" style="font-size:18px">4</div></div>
    </div>
    <div class="stitle">Schiffe im Überblick</div>
    <div class="card">${SCHIFFE_L.map(s=>{
      const st=schiffStatus(s.id);
      const al=KATEGORIEN.reduce((n,k)=>n+(state[s.id]?state[s.id][k.id].filter(r=>getStatus(r.bestand,r.soll)!=='ok').length:0),0);
      const pend=KATEGORIEN.reduce((n,k)=>n+(state[s.id]?state[s.id][k.id].filter(r=>r.bestellt).length:0),0);
      return`<div class="schiff-row" onclick="sollSchiff='${s.id}';setPage('soll',document.getElementById('nav-soll'))">
        <div class="sr-icon">${s.icon}</div>
        <div class="sr-info">
          <div class="sr-name">${s.name}</div>
          <div class="sr-sub">${al>0?`${al} Alarm${al>1?'e':''}`:'Kein Alarm'}${pend>0?` · ${pend} Bestellung${pend>1?'en':''} offen`:''}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <div class="status-dot" style="background:${statusCol(st)}"></div>
          <span class="tag ${st==='bad'?'t-bad':st==='warn'?'t-warn':'t-ok'}">${st==='bad'?'Leer':st==='warn'?'Tief':'OK'}</span>
        </div>
      </div>`;
    }).join('')}</div>
    <div class="stitle">Warnungen (${warnings.length})</div>
    ${warnHTML}`;
}

// BESTELLUNGEN
function renderBestell(){
  const items=[];
  SCHIFFE_L.forEach(({id,name,icon})=>{
    if(!state[id])return;
    KATEGORIEN.forEach(k=>{
      state[id][k.id].forEach((r,i)=>{
        if(r.bestellt)items.push({schiff:id,schiffName:name,icon,artikel:PRODUKTE[k.id][i].name,kat:k.id,katLabel:k.label,idx:i,r,st:getStatus(r.bestand,r.soll)});
      });
    });
  });
  if(!items.length)return`<div class="empty"><div class="empty-icon">✅</div><div class="empty-title">Keine Bestellungen</div><div class="empty-sub">Sobald ein Schiff bestellt, erscheint es hier.</div></div>`;
  const bySchiff={};
  items.forEach(it=>{if(!bySchiff[it.schiff])bySchiff[it.schiff]=[];bySchiff[it.schiff].push(it);});
  let html='';
  Object.entries(bySchiff).forEach(([id,rows])=>{
    const info=SCHIFFE_L.find(s=>s.id===id);
    html+=`<div class="stitle">${info.icon} ${info.name}</div><div class="card">`;
    rows.forEach(it=>{
      html+=`<div class="bestell-item">
        <div class="bi-icon" style="background:${it.st==='bad'?'var(--red-l)':'var(--orange-l)'}">${it.st==='bad'?'🔴':'🟠'}</div>
        <div class="bi-info">
          <div class="bi-name">${it.artikel}</div>
          <div class="bi-detail">${it.katLabel} · Ist: ${fmtH(it.r.bestand,it.kat)} · Soll: ${fmtH(it.r.soll,it.kat)}</div>
          <div class="bi-schiff">${info.icon} ${info.name}</div>
        </div>
        <button class="bi-btn" onclick="confirmOrder('${it.schiff}','${it.kat}',${it.idx})">Bestellt ✓</button>
      </div>`;
    });
    html+='</div>';
  });
  html+=`<button class="print-btn" onclick="printBestell()">🖨 Bestellliste drucken</button>`;
  return html;
}

// SOLL
function renderSoll(){
  const schiffOpts=SCHIFFE_L.map(s=>`<option value="${s.id}" ${sollSchiff===s.id?'selected':''}>${s.icon} ${s.name}</option>`).join('');
  const d=state[sollSchiff];
  const items=PRODUKTE[sollKat];
  let rows='',lastCat='';
  items.forEach((p,i)=>{
    const r=d[sollKat][i];
    const st=getStatus(r.bestand,r.soll);
    const diff=r.soll>0?Math.round((r.bestand-r.soll)*2)/2:null;
    if(p.kat&&p.kat!==lastCat){rows+=`<tr><td colspan="5" class="cat-cell">${p.kat}</td></tr>`;lastCat=p.kat;}
    rows+=`<tr>
      <td><strong>${p.name}</strong>${p.nr?`<br><small style="color:var(--text3)">${p.nr}</small>`:''}</td>
      <td style="text-align:center;font-weight:700">${fmtH(r.bestand,sollKat)}</td>
      <td style="text-align:center"><input class="soll-inp" type="number" min="0" step="0.5" value="${r.soll}" onchange="setSoll('${sollSchiff}','${sollKat}',${i},this.value)"/></td>
      <td style="text-align:center">${diff!==null?`<span style="font-weight:700;color:${diff>=0?'var(--green)':'var(--red)'}">${diff>=0?'+':''}${diff}</span>`:'–'}</td>
      <td style="text-align:center"><span class="tag ${st==='bad'?'t-bad':st==='warn'?'t-warn':'t-ok'}">${st==='bad'?'Leer':st==='warn'?'Tief':'OK'}</span></td>
    </tr>`;
  });
  return`
    <div style="margin-bottom:12px"><select class="sh-select" onchange="sollSchiff=this.value;renderPage()">${schiffOpts}</select></div>
    <div class="seg">${KATEGORIEN.map(k=>`<button class="seg-btn ${sollKat===k.id?'active':''}" onclick="sollKat='${k.id}';renderPage()">${k.label}</button>`).join('')}</div>
    <div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Artikel</th><th style="text-align:center">Ist</th><th style="text-align:center">Soll ✏️</th><th style="text-align:center">Diff</th><th style="text-align:center">Status</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>
    <div style="font-size:11px;color:var(--text3);text-align:center;margin-top:6px">Soll-Wert eingeben → wird sofort gespeichert</div>`;
}

// STATISTIK
function renderStatistik(){
  const verbrauch={};
  SCHIFFE_L.forEach(({id})=>{verbrauch[id]=0;});
  log.filter(e=>e.typ==='Verbrauch').forEach(e=>{if(verbrauch[e.von]!==undefined)verbrauch[e.von]+=e.menge;});
  const maxV=Math.max(...Object.values(verbrauch),1);
  const kosten={};
  SCHIFFE_L.forEach(({id})=>{let k=0;if(state[id])state[id].soft.forEach((r,i)=>{k+=r.bestand*(PRODUKTE.soft[i].chf||0);});kosten[id]=k;});
  const maxK=Math.max(...Object.values(kosten),1);
  const d30=new Date();d30.setDate(d30.getDate()-30);
  const recent=log.filter(e=>new Date(e.zeit)>=d30);
  const byTyp={Zubuchung:0,Verbrauch:0,Bezug:0};
  recent.forEach(e=>{if(byTyp[e.typ]!==undefined)byTyp[e.typ]++;});
  // By category
  const byKat={};
  KATEGORIEN.forEach(k=>{byKat[k.id]=0;});
  log.filter(e=>e.typ==='Verbrauch').forEach(e=>{if(e.kat&&byKat[e.kat]!==undefined)byKat[e.kat]+=e.menge;});

  return`
    <div class="stitle">Lagerbestand-Wert Soft (EK)</div>
    <div class="card" style="padding:14px">
      ${SCHIFFE_L.map(s=>`<div class="kb-row">
        <div class="kb-label">${s.icon} ${s.name.replace('Bootshaus','BH')}</div>
        <div class="kb-track"><div class="kb-fill" style="width:${Math.round(kosten[s.id]/maxK*100)}%"></div></div>
        <div class="kb-val">CHF ${(kosten[s.id]||0).toFixed(0)}</div>
      </div>`).join('')}
    </div>
    <div class="stitle">Verbrauch gesamt</div>
    <div class="card" style="padding:14px">
      ${SCHIFFE_L.map(s=>`<div class="kb-row">
        <div class="kb-label">${s.icon} ${s.name.replace('Bootshaus','BH')}</div>
        <div class="kb-track"><div class="kb-fill" style="width:${Math.round((verbrauch[s.id]||0)/maxV*100)}%;background:var(--orange)"></div></div>
        <div class="kb-val">${(verbrauch[s.id]||0)} Einh.</div>
      </div>`).join('')}
    </div>
    <div class="stitle">Verbrauch nach Kategorie</div>
    <div class="card" style="padding:14px">
      ${KATEGORIEN.map(k=>`<div class="kb-row">
        <div class="kb-label">${k.label}</div>
        <div class="kb-track"><div class="kb-fill" style="width:${Math.round((byKat[k.id]||0)/Math.max(...Object.values(byKat),1)*100)}%;background:${k.color}"></div></div>
        <div class="kb-val">${(byKat[k.id]||0)} Einh.</div>
      </div>`).join('')}
    </div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-icon">↑</div><div class="stat-label">Zubuchungen</div><div class="stat-val" style="color:var(--blue)">${byTyp.Zubuchung}</div></div>
      <div class="stat"><div class="stat-icon">↓</div><div class="stat-label">Verbrauch</div><div class="stat-val" style="color:var(--red)">${byTyp.Verbrauch}</div></div>
      <div class="stat"><div class="stat-icon">⇄</div><div class="stat-label">Bezüge</div><div class="stat-val" style="color:var(--green)">${byTyp.Bezug}</div></div>
      <div class="stat"><div class="stat-icon">📋</div><div class="stat-label">Total (30 Tage)</div><div class="stat-val">${recent.length}</div></div>
    </div>`;
}

// LOG
function renderLog(){
  if(!log.length)return`<div class="empty"><div class="empty-icon">📋</div><div class="empty-title">Noch keine Aktivitäten</div></div>`;
  return`<div class="card">${log.slice(0,80).map(e=>{
    const col=e.typ==='Zubuchung'?'var(--blue)':e.typ==='Verbrauch'?'var(--red)':'var(--green)';
    return`<div class="log-item">
      <div class="log-dot" style="background:${col};margin-top:3px;flex-shrink:0"></div>
      <div class="log-body">
        <div class="log-title">${e.typ==='Zubuchung'?'↑':'↓'} ${e.typ} · ${e.menge} ${e.einheit||''}</div>
        <div class="log-sub">${e.artikel}${e.kat?` · ${KATEGORIEN.find(k=>k.id===e.kat)?.label||e.kat}`:''}</div>
        <div class="log-sub">${e.von||'–'} → ${e.nach||'–'}</div>
        <div class="log-time">${fmtT(e.zeit)}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

// ACTIONS
async function setSoll(schiff,kat,idx,val){
  const soll=parseFloat(val)||0;
  state[schiff][kat][idx].soll=soll;
  save();updateBadge();
  await rpc('set_bestand_meta',{p_standort:schiff,p_kat:kat,p_artikel_index:idx,p_soll:soll});
  await doSync();
}

async function confirmOrder(schiff,kat,idx){
  state[schiff][kat][idx].bestellt=0;
  save();renderPage();
  await rpc('set_bestand_meta',{p_standort:schiff,p_kat:kat,p_artikel_index:idx,p_bestellt:false});
  await doSync();
}

function printBestell(){
  const items=[];
  SCHIFFE_L.forEach(({id,name})=>{
    if(!state[id])return;
    KATEGORIEN.forEach(k=>{state[id][k.id].forEach((r,i)=>{if(r.bestellt)items.push({schiff:name,artikel:PRODUKTE[k.id][i].name,katLabel:k.label,kat:k.id,r});});});
  });
  const w=window.open('','_blank');
  w.document.write(`<html><head><title>SZR Bestellliste ${new Date().toLocaleDateString('de-CH')}</title>
  <style>body{font-family:sans-serif;font-size:13px;padding:20px}h2{margin-bottom:4px}p{color:#666;margin-bottom:16px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:7px 10px}th{background:#f5f5f5;font-weight:600}</style></head>
  <body><h2>SZR Bestellliste</h2><p>${new Date().toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
  <table><thead><tr><th>Schiff</th><th>Kategorie</th><th>Artikel</th><th>Ist</th><th>Soll</th></tr></thead>
  <tbody>${items.map(it=>`<tr><td>${it.schiff}</td><td>${it.katLabel}</td><td>${it.artikel}</td><td>${fmtH(it.r.bestand,it.kat)}</td><td>${fmtH(it.r.soll,it.kat)}</td></tr>`).join('')}</tbody>
  </table></body></html>`);
  w.print();
}

// INIT
document.getElementById('hdr-date').textContent=new Date().toLocaleDateString('de-CH',{weekday:'long',day:'numeric',month:'long'});
doSync();
setInterval(doSync,45000);
renderPage();
</script>
</body>
